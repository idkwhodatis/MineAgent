name: MineAgent actual OpenEvolve initial epoch and recovery
on:
  push:
    branches: [master]
  pull_request:
    paths:
      - 'backend/**'
      - 'workers/openevolve/**'
      - 'packages/openevolve_adapter/**'
      - 'runtimes/openevolve*/**'
      - 'tests/integration/*openevolve*'
      - 'script/verify_openevolve_initial.py'
      - '.github/workflows/mineagent-openevolve-initial.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-initial-epoch:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      POSTGRES_USER: tradegrad_ci
      POSTGRES_DB: tradegrad_ci
      DATA_PROVIDER_MODE: fixture
      E2E_LIVE_PROVIDERS: '0'
      MODEL_PROFILES_ENABLED: 'false'
      MINEAGENT_OE_INITIAL_REQUIRED: '1'
      RUN_BACKUP_RESTORE_DRILL: '1'
      MINEAGENT_OE_INITIAL_PROOF: var/oe-initial-proof
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Materialize unchanged legacy compatibility source and host test closure
        run: |
          python script/bootstrap_tradegrad_compat.py
          python -m pip install --require-hashes -r backend/requirements.lock
          mkdir -p var/oe-initial-private var/oe-initial-proof
          python - <<'PYPINS'
          import hashlib, json
          from pathlib import Path
          from runtimes.openevolve_operational.recipe_pins import PINS
          values = {}
          for key, (path, expected) in PINS.items():
              actual = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              assert actual == expected
              values[key] = actual
          Path('var/oe-initial-proof/recipe-pins.json').write_text(json.dumps(values, sort_keys=True) + '\n')
          PYPINS
      - name: Fetch and verify exact upstream source
        shell: bash
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/openevolve-upstream"
          git init "$source"
          git -C "$source" fetch --depth 1 https://github.com/algorithmicsuperintelligence/openevolve.git 8c65f74aa906abc0b0e9cae948ddf4c4c6570bdc
          git -C "$source" checkout --detach FETCH_HEAD
          test "$(git -C "$source" rev-parse HEAD)" = 8c65f74aa906abc0b0e9cae948ddf4c4c6570bdc
          mkdir -p .runtime
          python runtimes/openevolve/materialize_source.py --source "$source" --destination .runtime/openevolve-source
          python runtimes/openevolve/verify_build_inputs.py .runtime/openevolve-source
      - name: Materialize exact base in local daemon and build fixed installed runtimes
        shell: bash
        run: |
          set -euo pipefail
          docker pull python:3.12.14-slim-bookworm@sha256:392307d22300de8b5986851a12d9176dfc0fc073e65bf6523ebd7dcbeb23564e
          native=$(python -m packages.tradegrad_adapter.environment)
          [[ "$native" =~ ^[0-9a-f]{64}$ ]]
          printf '%s\n' "$native" > var/oe-initial-proof/native-source.sha256
          python -m runtimes.openevolve_evaluator.recipe > var/oe-initial-proof/wrapper.sha256
          docker build --build-arg "TRADEGRAD_ENVIRONMENT_DIGEST=$native" --iidfile var/oe-initial-proof/parent.iid -f runtimes/evaluator/Dockerfile .
          parent=$(cat var/oe-initial-proof/parent.iid)
          [[ "$parent" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker build --network none --build-arg "NATIVE_EVALUATOR_IMAGE=$parent" --iidfile var/oe-initial-proof/native.iid -f runtimes/openevolve_evaluator/Dockerfile .
          docker build --iidfile var/oe-initial-proof/controller.iid -f runtimes/openevolve_operational/Dockerfile .
      - name: Require installed controller import closure without network or database
        run: |
          docker run --rm --network none --ipc none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user 65533:65533 --memory 1g --memory-swap 1g --pids-limit 32 --cpus 1 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m,uid=65533,gid=65533,mode=0700 \
            --mount type=bind,src="$GITHUB_WORKSPACE/script/verify_openevolve_initial.py",dst=/probe.py,readonly \
            --entrypoint python "$(cat var/oe-initial-proof/controller.iid)" -I /probe.py --installed \
            > var/oe-initial-proof/installed.json
      - name: Generate masked disposable database credentials
        run: python script/ci_test_environment.py
      - name: Start exact disposable PostgreSQL for composed persisted numeric gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p var/oe-initial-private
          docker run --detach --name tradegrad-ci-postgres --cidfile "$GITHUB_WORKSPACE/var/oe-initial-private/postgres.cid" \
            --label io.mineagent.ci=numeric-postgres --label io.tradegrad.ci=postgres --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_USER --env POSTGRES_PASSWORD --env POSTGRES_DB \
            --tmpfs /var/lib/postgresql:rw,size=2g,nosuid \
            --health-cmd 'pg_isready -h 127.0.0.1 -U tradegrad_ci -d tradegrad_ci' \
            --health-interval 2s --health-timeout 5s --health-retries 30 postgres:18.6 >/dev/null
          for attempt in $(seq 1 90); do
            state=$(docker inspect --format '{{.State.Health.Status}}' tradegrad-ci-postgres)
            if [ "$state" = healthy ]; then exit 0; fi
            if [ "$state" = unhealthy ]; then break; fi
            sleep 1
          done
          echo 'Disposable PostgreSQL was not healthy' >&2
          exit 1
      - name: Bind streaming backup clients to the exact disposable PostgreSQL container
        run: |
          python - <<'PYCLIENT'
          import os, pathlib, re, shlex, subprocess, sys
          container = pathlib.Path("var/oe-initial-private/postgres.cid").read_text().strip()
          if not re.fullmatch(r"[0-9a-f]{64}", container):
              raise SystemExit("Invalid disposable service identity")
          actual = subprocess.check_output(["docker", "inspect", "--format", "{{.Id}}", container], text=True, timeout=10).strip()
          if actual != container:
              raise SystemExit("Disposable service identity changed")
          root = pathlib.Path("var/ci-pg").resolve()
          root.mkdir(parents=True, mode=0o700, exist_ok=False)
          config = root / "docker-config"
          config.mkdir(mode=0o700)
          (config / "config.json").write_text('{"auths":{}}')
          script = pathlib.Path("script/ci_pg_client.py").resolve()
          for tool in ("pg_dump", "pg_restore"):
              executable = root / tool
              executable.write_text(
                  "#!/bin/sh\nGITHUB_ACTIONS=true TRADEGRAD_CI_POSTGRES_ID=" + container
                  + " DOCKER_CONFIG=" + shlex.quote(str(config))
                  + " exec " + shlex.quote(sys.executable) + " " + shlex.quote(str(script))
                  + " " + tool + ' "$@"\n'
              )
              executable.chmod(0o700)
              with open(os.environ["GITHUB_ENV"], "a") as stream:
                  print(tool.upper() + "_EXECUTABLE=" + str(executable), file=stream)
          PYCLIENT
      - name: Require actual first epoch cold restore and owner-loss original deadline
        shell: bash
        run: |
          set -euo pipefail
          export MINEAGENT_OE_CONTROLLER_IMAGE="$(cat var/oe-initial-proof/controller.iid)"
          export MINEAGENT_OE_NATIVE_IMAGE="$(cat var/oe-initial-proof/native.iid)"
          export MINEAGENT_OE_NATIVE_PARENT_IMAGE="$(cat var/oe-initial-proof/parent.iid)"
          status=0
          python -m pytest tests/integration/test_openevolve_initial_runtime.py -q --junitxml=var/oe-initial-private/runtime.xml || status=$?
          python script/verify_openevolve_initial.py --junit var/oe-initial-private/runtime.xml --proof var/oe-initial-proof
          test "$status" = 0
      - name: Require no retained controller or native units without label-wide removal
        if: always()
        run: |
          for label in io.mineagent.managed=mineagent-openevolve-orchestrator-v1 io.mineagent.oe-native.admission; do
            ids=$(timeout 15s docker ps --all --quiet --no-trunc --filter "label=$label")
            test -z "$ids" || { echo 'OpenEvolve containment not confirmed' >&2; exit 1; }
          done
      - name: Remove only exact disposable numeric PostgreSQL
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          file="$GITHUB_WORKSPACE/var/oe-initial-private/postgres.cid"
          if [ ! -f "$file" ] || [ -L "$file" ]; then
            ids=$(timeout 15s docker ps --all --quiet --no-trunc --filter label=io.mineagent.ci=numeric-postgres)
            test -z "$ids"
            exit 0
          fi
          id=$(cat "$file")
          [[ "$id" =~ ^[0-9a-f]{64}$ ]]
          actual=$(timeout 15s docker inspect --format '{{.Id}}|{{.Name}}|{{index .Config.Labels "io.mineagent.ci"}}' "$id")
          test "$actual" = "$id|/tradegrad-ci-postgres|numeric-postgres"
          timeout 30s docker rm --force --volumes "$id" >/dev/null
          test -z "$(timeout 15s docker ps --all --quiet --no-trunc --filter "id=$id")"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mineagent-openevolve-initial-${{ github.sha }}
          path: var/oe-initial-proof/
          retention-days: 7
          if-no-files-found: error
