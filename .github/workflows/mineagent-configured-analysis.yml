name: MineAgent configured protected Qlib analysis generation

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - "runtimes/factor_execution/**"
      - "runtimes/factor_normalizer/**"
      - "runtimes/hostile_deadline/**"
      - "packages/rdagent_adapter/**"
      - "infra/application.Dockerfile*"
      - "infra/compose.full.yml"
      - "infra/compose.providers.yml"
      - "script/ci_rd_*"
      - "script/compose_provider_runtime.py"
      - "script/compose_runtime.py"
      - "tests/compose/test_provider*"
      - "packages/rdagent_provider/**"
      - "tests/rdagent_provider/**"
      - "runtimes/rdagent_provider/**"
      - "tests/integration/*provider*"
      - "packages/qlib_adapter/**"
      - "packages/research_runtime/analysis*"
      - "runtimes/qlib/**"
      - "runtimes/research_supervisor/analysis*"
      - "workers/research/analysis_process.py"
      - "workers/research/rdagent_configured.py"
      - "tests/qlib/**"
      - "tests/rdagent/**"
      - "runtimes/rdagent_operational/**"
      - "runtimes/rdagent/**"
      - "workers/research/rdagent_operational.py"
      - "tests/integration/test_rdagent_actual_controller.py"
      - "backend/**"
      - "workers/research/numeric*"
      - "packages/research_runtime/numeric*"
      - "tests/integration/test_numeric*"
      - ".github/workflows/mineagent-configured-analysis.yml"
      - "runtimes/qlib/**"
      - "packages/qlib_adapter/**"
      - "workers/research/analysis_process.py"
      - "workers/research/rdagent_configured*"
      - "workers/research/rdagent_queue.py"
      - "workers/research/dispatcher.py"
      - "workers/research/queue.py"
      - "tests/integration/test_rdagent_submission_postgres.py"
      - "tests/integration/test_rdagent_user_flow.py"
      - "tests/integration/rd_submission_fixture.py"
      - "tests/integration/test_rdagent_configured_analysis.py"
      - "tests/integration/test_configured_analysis_restore.py"
      - "script/ci_pg_client.py"
      - "tests/integration/rd_configured*"
      - "tests/integration/*engine_result*"
      - "tests/integration/factor_execution_http.py"
      - "frontend/**"
      - "packages/contracts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configured-direct-analysis:
    runs-on: ubuntu-22.04
    # Sequential locked image builds, host SDK setup, five real controller executions
    # and required browsers share this job. Individual 60s/8s process bounds stay fixed.
    timeout-minutes: 120
    env:
      POSTGRES_USER: tradegrad_ci
      POSTGRES_DB: tradegrad_ci
      DATA_PROVIDER_MODE: fixture
      E2E_LIVE_PROVIDERS: "0"
      MODEL_PROFILES_ENABLED: "false"
      MINEAGENT_RD_CONTROLLER_REQUIRED: "1"
      MINEAGENT_CONFIGURED_ANALYSIS_REQUIRED: "1"
      MINEAGENT_RD_USER_FLOW_REQUIRED: "1"
      MINEAGENT_RD_PROVIDER_FLOW_REQUIRED: "1"
      MINEAGENT_RD_CREATE_BROWSER_REQUIRED: "1"
      MINEAGENT_CONFIGURED_BROWSER_REQUIRED: "1"
      RUN_BACKUP_RESTORE_DRILL: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Materialize unchanged legacy compatibility sources
        run: python script/bootstrap_tradegrad_compat.py
      - name: Install unchanged host test closure
        run: python -m pip install --require-hashes -r backend/requirements.lock
      - name: Install isolated host SDK from the exact existing RD dependency pins
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/rd-provider-sdk"
          "$RUNNER_TEMP/rd-provider-sdk/bin/python" -m pip install --require-hashes -r runtimes/rdagent_provider/requirements.lock
          "$RUNNER_TEMP/rd-provider-sdk/bin/python" -m pip check
          printf 'MINEAGENT_PROVIDER_SDK_PYTHON=%s\n' "$RUNNER_TEMP/rd-provider-sdk/bin/python" >> "$GITHUB_ENV"
      - name: Require provider protocol and actual local SDK containment regressions
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MINEAGENT_PROVIDER_SDK_PYTHON"
          test -x "$MINEAGENT_PROVIDER_SDK_PYTHON"
          mkdir -p var/numeric-private var/numeric-proof
          status=0
          python -m pytest tests/rdagent_provider -q -p no:cacheprovider \
            --junitxml=var/numeric-private/provider.xml || status=$?
          python - <<'PYPROVIDER'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          from script.summarize_ci_junit import summarize
          source=Path('var/numeric-private/provider.xml')
          summarize(source,Path('var/numeric-proof/provider-outcomes.xml'))
          cases=list(ET.parse(source).getroot().iter('testcase'))
          assert len(cases)==137
          names={case.get('name') for case in cases}
          assert {'test_actual_sdk_route_and_usage[chat]', 'test_actual_sdk_route_and_usage[embedding]', 'test_actual_identity_callback_precedes_request_and_matches_result', 'test_unconfirmed_group_never_records_stop_or_returns_result'} <= names
          assert not any(case.find(tag) is not None for case in cases for tag in ('failure','error','skipped'))
          PYPROVIDER
          test "$status" = 0
      - name: Build locked frontend for the genuine completed-result browser
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
      - name: Install matched Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Fetch only exact existing numeric wheels
        run: |
          mkdir -p .wheelhouse-factor-numeric var/numeric-proof
          python -m runtimes.factor_execution.verify_inventory > var/numeric-proof/source-inventory.json
          python -m pip download --require-hashes --only-binary=:all: --no-deps -r runtimes/factor_normalizer/requirements.lock -d .wheelhouse-factor-numeric
      - name: Materialize exact pinned base in local Docker daemon
        run: docker pull python:3.12.14-slim-bookworm@sha256:392307d22300de8b5986851a12d9176dfc0fc073e65bf6523ebd7dcbeb23564e
      - name: Build separate fixed candidate and native normalizer images
        run: |
          docker build --iidfile var/numeric-proof/candidate.iid -f runtimes/factor_execution/Dockerfile .
          docker build --iidfile var/numeric-proof/normalizer.iid -f runtimes/factor_normalizer/Dockerfile .
      - name: Verify installed numeric native dependency closures without candidate execution
        run: |
          for role in candidate normalizer; do
            docker run --rm --network none --ipc none --read-only --cap-drop ALL \
              --security-opt no-new-privileges --user 65533:65533 --pids-limit 32 \
              --memory 256m --memory-swap 256m --cpus 1 \
              --tmpfs /tmp:rw,noexec,nosuid,nodev,size=4m,uid=65533,gid=65533,mode=0700 \
              --entrypoint python "$(cat var/numeric-proof/$role.iid)" \
              -I -m runtimes.factor_execution.probe_dependencies "$role" \
              > "var/numeric-proof/$role-dependencies.json"
          done
      - name: Reproduce exact installed controller wheels
        shell: bash
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/rd-controller-upstream"
          git init "$source"
          git -C "$source" fetch --depth 1 https://github.com/microsoft/RD-Agent.git 484776c211e4fbbeef03e0ec00d6bbee7362a4f4
          git -C "$source" checkout --detach FETCH_HEAD
          test "$(git -C "$source" rev-parse HEAD)" = 484776c211e4fbbeef03e0ec00d6bbee7362a4f4
          python runtimes/rdagent/build_profile.py --source "$source" --output .runtime/rdagent-wheels
          cmp .runtime/rdagent-wheels/build-report.json runtimes/rdagent/wheel-proof.json
          python -m runtimes.rdagent_operational.build_profile --output .runtime/rdagent-operational-wheels
          python -m runtimes.rdagent_operational.build_profile --output "$RUNNER_TEMP/controller-build-two"
          cmp .runtime/rdagent-operational-wheels/operational-build-report.json "$RUNNER_TEMP/controller-build-two/operational-build-report.json"
          cmp .runtime/rdagent-operational-wheels/operational-build-report.json runtimes/rdagent_operational/wheel-proof.json
          cp .runtime/rdagent-operational-wheels/operational-build-report.json var/numeric-proof/
          docker build --iidfile var/numeric-proof/orchestrator.iid -f runtimes/rdagent_operational/Dockerfile .
      - name: Reproduce exact accepted installed Qlib parent
        shell: bash
        run: |
          set -euo pipefail
          qlib="$RUNNER_TEMP/analysis-qlib-upstream"
          git init "$qlib"
          git -C "$qlib" fetch --depth 1 https://github.com/microsoft/qlib.git 54355232463878d2eebb91fe0ee5fa7fa1f5976c
          git -C "$qlib" checkout --detach FETCH_HEAD
          test "$(git -C "$qlib" rev-parse HEAD)" = 54355232463878d2eebb91fe0ee5fa7fa1f5976c
          python -I runtimes/qlib/verify_build.py materialize "$qlib" --inventory runtimes/qlib/source-inventory.json --destination .runtime/qlib-source
          python runtimes/qlib/build_runner_profile.py --source "$RUNNER_TEMP/rd-controller-upstream" --output .runtime/qlib-wheels
          python -I runtimes/qlib/verify_build.py profile .runtime/qlib-wheels --inventory runtimes/qlib/wheel-proof.json
          docker build --iidfile var/numeric-proof/qlib-installed.iid -f runtimes/qlib/Dockerfile .
      - name: Build no-network derivative analysis image without installing dependencies
        shell: bash
        run: |
          set -euo pipefail
          parent=$(cat var/numeric-proof/qlib-installed.iid)
          [[ "$parent" =~ ^sha256:[a-f0-9]{64}$ ]]
          parent_ref="mineagent-local-parent:${parent#sha256:}"
          docker tag "$parent" "$parent_ref"
          test "$(docker image inspect --format '{{.Id}}' "$parent_ref")" = "$parent"
          docker build --pull=false --network none --build-arg "QLIB_IMAGE=$parent_ref" --iidfile var/numeric-proof/analysis.iid -f runtimes/qlib/Dockerfile.direct .
          test "$(docker image inspect --format '{{.Id}}' "$parent_ref")" = "$parent"
      - name: Verify installed parent direct Qlib mathematics without host native imports
        shell: bash
        run: |
          set -euo pipefail
          parent=$(cat var/numeric-proof/qlib-installed.iid)
          mkdir -p var/numeric-private
          cleanup() {
            file=var/numeric-private/qlib-proof.cid
            [ -f "$file" ] && [ ! -L "$file" ] || return
            cid=$(cat "$file")
            [[ "$cid" =~ ^[a-f0-9]{64}$ ]] || return 1
            actual=$(timeout 15s docker inspect --format '{{.Id}}|{{.Name}}|{{.Image}}' "$cid")
            test "$actual" = "$cid|/mineagent-qlib-direct-installation-proof|$parent"
            timeout 30s docker rm --force "$cid" >/dev/null
          }
          trap cleanup EXIT
          timeout 120s docker run --cidfile var/numeric-private/qlib-proof.cid \
            --name mineagent-qlib-direct-installation-proof \
            --network none --ipc none --read-only --cap-drop ALL \
            --env OPENBLAS_NUM_THREADS=1 --env MKL_NUM_THREADS=1 \
            --security-opt no-new-privileges --user 65532:65532 --pids-limit 32 \
            --memory 512m --memory-swap 512m --cpus 1 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=4m,uid=65532,gid=65532,mode=0700 \
            --entrypoint /opt/qlib/bin/python "$parent" -I -m runtimes.qlib.verify_direct \
            > var/numeric-proof/qlib-installed-direct.json
      - name: Generate masked disposable database credentials
        run: python script/ci_test_environment.py
      - name: Start exact disposable PostgreSQL for composed persisted numeric gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p var/numeric-private
          docker run --detach --name tradegrad-ci-postgres --cidfile "$GITHUB_WORKSPACE/var/numeric-private/postgres.cid" \
            --label io.mineagent.ci=numeric-postgres --label io.tradegrad.ci=postgres --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_USER --env POSTGRES_PASSWORD --env POSTGRES_DB \
            --tmpfs /var/lib/postgresql:rw,size=2g,nosuid \
            --health-cmd 'pg_isready -h 127.0.0.1 -U tradegrad_ci -d tradegrad_ci' \
            --health-interval 2s --health-timeout 5s --health-retries 30 postgres:18.6 >/dev/null
          for attempt in $(seq 1 90); do
            state=$(docker inspect --format '{{.State.Health.Status}}' tradegrad-ci-postgres)
            if [ "$state" = healthy ]; then exit 0; fi
            if [ "$state" = unhealthy ]; then break; fi
            sleep 1
          done
          echo 'Disposable PostgreSQL was not healthy' >&2
          exit 1
      - name: Bind streaming backup clients to the exact disposable PostgreSQL container
        run: |
          python - <<'PYCLIENT'
          import os, pathlib, re, shlex, subprocess, sys
          container = pathlib.Path("var/numeric-private/postgres.cid").read_text().strip()
          if not re.fullmatch(r"[0-9a-f]{64}", container):
              raise SystemExit("Invalid disposable service identity")
          actual = subprocess.check_output(["docker", "inspect", "--format", "{{.Id}}", container], text=True, timeout=10).strip()
          if actual != container:
              raise SystemExit("Disposable service identity changed")
          root = pathlib.Path("var/ci-pg").resolve()
          root.mkdir(parents=True, mode=0o700, exist_ok=False)
          config = root / "docker-config"
          config.mkdir(mode=0o700)
          (config / "config.json").write_text('{"auths":{}}')
          script = pathlib.Path("script/ci_pg_client.py").resolve()
          for tool in ("pg_dump", "pg_restore"):
              executable = root / tool
              executable.write_text(
                  "#!/bin/sh\nGITHUB_ACTIONS=true TRADEGRAD_CI_POSTGRES_ID=" + container
                  + " DOCKER_CONFIG=" + shlex.quote(str(config))
                  + " exec " + shlex.quote(sys.executable) + " " + shlex.quote(str(script))
                  + " " + tool + ' "$@"\n'
              )
              executable.chmod(0o700)
              with open(os.environ["GITHUB_ENV"], "a") as stream:
                  print(tool.upper() + "_EXECUTABLE=" + str(executable), file=stream)
          PYCLIENT
      # The first existing four-unit case invokes the exact-one Chromium harness
      # before release; its raw JUnit stays private. The second is real cold restore.
      - name: Require actual configured results browser and cold restore
        shell: bash
        run: |
          set -euo pipefail
          export MINEAGENT_CANDIDATE_IMAGE="$(cat var/numeric-proof/candidate.iid)"
          export MINEAGENT_NORMALIZER_IMAGE="$(cat var/numeric-proof/normalizer.iid)"
          export MINEAGENT_ORCHESTRATOR_IMAGE="$(cat var/numeric-proof/orchestrator.iid)"
          export MINEAGENT_ANALYSIS_IMAGE="$(cat var/numeric-proof/analysis.iid)"
          export MINEAGENT_QLIB_INSTALLED_IMAGE="$(cat var/numeric-proof/qlib-installed.iid)"
          status=0
          python -m pytest tests/integration/test_rdagent_configured_analysis.py \
            tests/integration/test_configured_analysis_restore.py \
            tests/integration/test_rdagent_submission_postgres.py tests/integration/test_rdagent_user_flow.py \
            tests/integration/test_rdagent_provider_user_flow.py tests/integration/test_rd_provider_predicates.py \
            tests/integration/test_seed_parent_contract_migration.py -q \
            --junitxml=var/numeric-private/controller.xml || status=$?
          python - <<'PYRESULT'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          from script.summarize_ci_junit import summarize
          source=Path('var/numeric-private/controller.xml')
          summarize(source,Path('var/numeric-proof/controller-outcomes.xml'))
          cases=list(ET.parse(source).getroot().iter('testcase'))
          assert len(cases)==23
          names={case.get('name') for case in cases}
          required={'test_installed_seed_parent_check_accepts_nonnull_only_at_initial_step','test_repair_downgrade_refuses_retained_parent_and_restores_empty_contract','test_installed_authoring_contract_matches_real_canonical_producer','test_normal_provider_generated_price_level_uses_frozen_steer_and_real_units','test_actual_configured_source_snapshot_direct_analysis_generation','test_actual_configured_analysis_cold_restore_historical_read','test_authenticated_rd_queue_four_unit_declared_objective_and_exact_replay','test_http_submission_is_queued_without_synthetic_attempt_and_replays_after_disable','test_actual_first_claim_and_duplicate_are_distinct_from_queued_counter','test_queued_cancel_is_authenticated_and_cannot_create_attempt','test_claimed_cancel_without_any_physical_admission_revokes_real_fence'}
          assert required <= names
          assert len([n for n in names if n.startswith('test_direct_sql_cannot_sever_immutable_submission_graph[')])==4
          assert len([n for n in names if n.startswith('test_provider_request_and_conservative_amount_match_python[')])==8
          assert not any(case.find(tag) is not None for case in cases for tag in ('failure','error','skipped'))
          PYRESULT
          test "$status" = 0
      - name: Confirm exact numeric units are absent without label-based removal
        if: always()
        run: |
          ids=$(timeout 15s docker ps --all --quiet --no-trunc --filter label=io.mineagent.numeric.admission)
          test -z "$ids" || { echo 'Numeric unit containment is not confirmed' >&2; exit 1; }
      - name: Confirm exact protected analysis units are absent
        if: always()
        run: |
          ids=$(timeout 15s docker ps --all --quiet --no-trunc --filter label=io.mineagent.analysis.admission)
          test -z "$ids" || { echo 'Analysis unit containment is not confirmed' >&2; exit 1; }
      - name: Confirm exact controller units are absent
        if: always()
        run: |
          ids=$(timeout 15s docker ps --all --quiet --no-trunc --filter label=io.mineagent.managed=mineagent-rdagent-orchestrator-v2)
          test -z "$ids" || { echo 'Controller unit containment is not confirmed' >&2; exit 1; }
      - name: Confirm installed-parent proof container is absent
        if: always()
        run: |
          ids=$(timeout 15s docker ps --all --quiet --no-trunc --filter 'name=^/mineagent-qlib-direct-installation-proof$')
          test -z "$ids" || { echo 'Installed parent proof cleanup is not confirmed' >&2; exit 1; }
      - name: Remove only exact disposable numeric PostgreSQL
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          file="$GITHUB_WORKSPACE/var/numeric-private/postgres.cid"
          if [ ! -f "$file" ] || [ -L "$file" ]; then
            ids=$(timeout 15s docker ps --all --quiet --no-trunc --filter label=io.mineagent.ci=numeric-postgres)
            test -z "$ids"
            exit 0
          fi
          id=$(cat "$file")
          [[ "$id" =~ ^[0-9a-f]{64}$ ]]
          actual=$(timeout 15s docker inspect --format '{{.Id}}|{{.Name}}|{{index .Config.Labels "io.mineagent.ci"}}' "$id")
          test "$actual" = "$id|/tradegrad-ci-postgres|numeric-postgres"
          timeout 30s docker rm --force --volumes "$id" >/dev/null
          test -z "$(timeout 15s docker ps --all --quiet --no-trunc --filter "id=$id")"
      # Prior PG/browser/restore proofs and their exact cleanup finish before
      # this distinct real application-image subset. No host worker substitutes.
      - name: Prepare disposable normal Compose identities after prior PG cleanup
        run: python -m script.ci_compose_environment
      - name: Resolve existing official application and CLI base-image references
        run: python -m script.compose_image_evidence --resolve-bases
      - name: Require actual packaged API outbox worker and localhost SDK provider
        timeout-minutes: 40
        run: bash script/ci_rd_provider_compose.sh
      - name: Confirm packaged application subset cleanup
        if: always()
        run: |
          if [ -n "${COMPOSE_PROJECT_NAME:-}" ]; then
            python -m script.ci_compose_cleanup
            for label in io.mineagent.numeric.admission io.mineagent.analysis.admission io.mineagent.managed=mineagent-rdagent-orchestrator-v2; do
              ids=$(timeout 15s docker --host "unix://${TRADEGRAD_DOCKER_SOCKET:?}" ps --all --quiet --no-trunc --filter "label=$label")
              test -z "$ids" || { echo 'Packaged RD native containment not confirmed' >&2; exit 1; }
            done
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mineagent-configured-analysis-${{ github.sha }}
          path: var/numeric-proof/
          if-no-files-found: error
