name: MineAgent migration boundary

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility-bootstrap:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Materialize exact external dependency in fresh checkout
        run: python script/bootstrap_tradegrad_compat.py
      - name: Verify repeat materialization is non-destructive
        run: python script/bootstrap_tradegrad_compat.py
      - name: Install frozen control-plane test environment
        run: python -m pip install --require-hashes -r backend/requirements.lock
      - name: Validate source and materialization boundary
        run: python -m pytest tests/mineagent -q
      - name: Verify dependency fetch left tracked source unchanged
        run: git diff --exit-code && git diff --cached --exit-code
