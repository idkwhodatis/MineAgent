name: MineAgent isolated SQL candidate proof (not production acceptance)

on:
  push:
    branches: [master, experiment/pure-validator-proof-20261118]
  pull_request:
    paths:
      - ".github/workflows/mineagent-sql-candidates.yml"
      - ".github/workflows/v1-validation.yml"
      - "script/experimental_integration_partition.py"
      - "tests/runner/experimental_integration_partition.json"
      - "tests/runner/test_experimental_integration_partition.py"
      - "tests/runner/test_ci_acceptance_boundary.py"
      - "backend/alembic/**"
      - "backend/app/**"
      - "backend/requirements.lock"
      - "compatibility/tradegrad.json"
      - "packages/openevolve_structured/**"
      - "packages/structured_factor_strategy/**"
      - "packages/factors/**"
      - "packages/rdagent_adapter/**"
      - "packages/rdagent_provider/**"
      - "packages/research_inputs/**"
      - "packages/research_workflow/**"
      - "packages/research_runtime/**"
      - "packages/strategy_sdk/**"
      - "script/schema_keyset_candidate.py"
      - "script/sql_candidate_proof.py"
      - "script/heartbeat_graph_inventory.py"
      - "script/sql_candidate_catalog.py"
      - "docs/SQL_CANDIDATE_PROOF.md"
      - "docs/CURRENT_SQL_PROBES.md"
      - "script/bootstrap_tradegrad_compat.py"
      - "tests/rdagent/test_row_validation*"
      - "tests/structured/*sql_candidate*"
      - "tests/structured/test_schema_keyset_candidate.py"
      - "tests/sql_probes/**"
      - "tests/integration/test_rd_v3*"
      - "tests/integration/test_oe_trigger_target_probe.py"
      - "tests/integration/test_heartbeat_graph_inventory.py"
      - "tests/integration/test_canonical_text_reuse_probe.py"
      - "tests/integration/conftest.py"
      - "tests/integration/test_sql_candidate_catalog.py"
      - "tests/integration/test_row_validation*"
      - "tests/integration/test_schema_keyset_candidate.py"
      - "tests/integration/test_rdagent_validation_performance.py"
      - "tests/integration/test_schema_reference_cost.py"
      - "tests/openevolve/test_structured_persisted_identity.py"
      - "tests/openevolve/test_workflow_prompt.py"
      - "tests/structured/test_engine_oracle.py"
      - "tests/structured/test_operator.py"
      - "tests/structured/test_views.py"
      - "tests/openevolve/test_workflow_run.py"
      - "tests/rdagent/test_rdagent_workflow_child_contracts.py"
      - "tests/rdagent/test_rdagent_canonical_sql.py"
      - "tests/research_workflow/test_plan.py"
      - "tests/integration/workflow_oe_sql_fixture.py"
      - "tests/integration/rd_configured_dataset_fixture.py"
      - "tests/integration/rd_submission_fixture.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-candidates:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      DATA_PROVIDER_MODE: fixture
      E2E_LIVE_PROVIDERS: "0"
      MODEL_PROFILES_ENABLED: "false"
      MINEAGENT_SQL_COST_BENCHMARK: "1"
      MINEAGENT_SQL_CANDIDATE_CATALOG_DIR: var/sql-candidate-proof
      MINEAGENT_SQL_CANDIDATE_MEASUREMENTS_DIR: var/sql-candidate-proof
      POSTGRES_USER: tradegrad_ci
      POSTGRES_DB: tradegrad_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Materialize unchanged compatibility sources
        run: python script/bootstrap_tradegrad_compat.py
      - name: Install pinned existing backend test closure
        run: python -m pip install --require-hashes -r backend/requirements.lock
      - name: Record exact commit tree and tracked source hashes
        run: python script/sql_candidate_proof.py --source-evidence --output var/sql-candidate-proof/source.json
      - name: Require exact source-only candidate contracts
        id: source_contracts
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sql-candidate-private"
          files=(tests/rdagent/test_row_validation_invariant_sql.py tests/rdagent/test_row_validation_content_sql.py tests/structured/test_schema_keyset_candidate.py tests/structured/test_sql_candidate_workflow.py tests/structured/test_sql_candidate_harness.py)
          python -m pytest "${files[@]}" --collect-only -q -p no:cacheprovider > "$RUNNER_TEMP/sql-candidate-private/source-collection.txt"
          python -m pytest "${files[@]}" -q -p no:cacheprovider --junitxml="$RUNNER_TEMP/sql-candidate-private/source.xml"
          python script/sql_candidate_proof.py --group source --collection "$RUNNER_TEMP/sql-candidate-private/source-collection.txt" --junit "$RUNNER_TEMP/sql-candidate-private/source.xml" --output var/sql-candidate-proof/source-outcomes.json
      - name: Require exact four experimental partition contracts separately
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest tests/runner/test_experimental_integration_partition.py -q -p no:cacheprovider --junitxml="$RUNNER_TEMP/sql-candidate-private/partition.xml"
          python - <<'PYPARTITION'
          import os
          from pathlib import Path
          from xml.etree import ElementTree as ET
          source=Path(os.environ['RUNNER_TEMP'])/'sql-candidate-private/partition.xml'
          cases=list(ET.parse(source).getroot().iter('testcase'))
          assert len(cases)==4
          assert {case.get('name') for case in cases}=={'test_each_dedicated_experimental_group_requires_exact_successful_junit', 'test_partition_rejects_preexisting_exclusions_missing_nodes_or_changed_gates', 'test_experimental_partition_preserves_original_modules_and_full_collection', 'test_current_head_baseline_exact_inline_xml_gate_still_rejects_bad_results'}
          assert not any(case.find(tag) is not None for case in cases for tag in ('failure','error','skipped'))
          PYPARTITION
      - name: Start only an owned disposable PostgreSQL 18.6 service
        id: candidate_postgres
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          password=$(python -c 'import secrets; print(secrets.token_hex(32))')
          echo "::add-mask::$password"
          export POSTGRES_PASSWORD="$password"
          name="mineagent-sql-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # Fresh-schema proofs generate substantial WAL. Keep bounded tmpfs with
          # headroom for PostgreSQL memory and checkpoint before WAL crowds data.
          docker run --detach --name "$name" --cidfile "$RUNNER_TEMP/sql-candidate-private/postgres.cid" \
            --label "io.mineagent.sql-candidate=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --publish 127.0.0.1::5432 --env POSTGRES_USER --env POSTGRES_PASSWORD --env POSTGRES_DB \
            --memory 3g --memory-swap 3g --cpus 2 --pids-limit 128 \
            --tmpfs /var/lib/postgresql:rw,size=2g,nosuid \
            --health-cmd 'pg_isready -h 127.0.0.1 -U tradegrad_ci -d tradegrad_ci' \
            --health-interval 2s --health-timeout 5s --health-retries 30 \
            postgres:18.6 -c track_functions=pl -c statement_timeout=10000 -c lock_timeout=5000 \
            -c max_wal_size=256MB -c min_wal_size=80MB -c checkpoint_timeout=60s >/dev/null
          cid=$(cat "$RUNNER_TEMP/sql-candidate-private/postgres.cid")
          for attempt in $(seq 1 90); do
            state=$(docker inspect --format '{{.State.Health.Status}}' "$cid")
            if [ "$state" = healthy ]; then break; fi
            if [ "$state" = unhealthy ]; then exit 1; fi
            sleep 1
          done
          test "$state" = healthy
          endpoint=$(docker port "$cid" 5432/tcp)
          [[ "$endpoint" =~ ^127\.0\.0\.1:([0-9]+)$ ]]
          port="${BASH_REMATCH[1]}"
          printf 'TEST_DATABASE_URL=postgresql+psycopg://%s:%s@127.0.0.1:%s/%s\n' "$POSTGRES_USER" "$password" "$port" "$POSTGRES_DB" >> "$GITHUB_ENV"
          docker exec "$cid" psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc "SELECT version(); SHOW statement_timeout; SHOW lock_timeout; SHOW track_functions; SHOW max_wal_size; SHOW min_wal_size; SHOW checkpoint_timeout; SHOW fsync; SHOW synchronous_commit; SHOW full_page_writes;" > var/sql-candidate-proof/postgres.txt
      - name: Require 11 key-set PostgreSQL cases including the bounded component benchmark
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest tests/integration/test_schema_keyset_candidate.py --collect-only -q -p no:cacheprovider > "$RUNNER_TEMP/sql-candidate-private/keyset-collection.txt"
          python -m pytest tests/integration/test_schema_keyset_candidate.py -q -p no:cacheprovider --junitxml="$RUNNER_TEMP/sql-candidate-private/keyset.xml"
          python script/sql_candidate_proof.py --group keyset --collection "$RUNNER_TEMP/sql-candidate-private/keyset-collection.txt" --junit "$RUNNER_TEMP/sql-candidate-private/keyset.xml" --output var/sql-candidate-proof/keyset-outcomes.json
      - name: Require pristine catalog and 32 independent row-CHECK PostgreSQL cases
        if: ${{ !cancelled() && steps.source_contracts.outcome == 'success' && steps.candidate_postgres.outcome == 'success' }}
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          files=(tests/integration/test_sql_candidate_catalog.py tests/integration/test_row_validation_invariants.py tests/integration/test_row_validation_content.py)
          python -m pytest "${files[@]}" --collect-only -q -p no:cacheprovider > "$RUNNER_TEMP/sql-candidate-private/rows-collection.txt"
          python -m pytest "${files[@]}" -q -p no:cacheprovider --junitxml="$RUNNER_TEMP/sql-candidate-private/rows.xml"
          python script/sql_candidate_proof.py --group rows --collection "$RUNNER_TEMP/sql-candidate-private/rows-collection.txt" --junit "$RUNNER_TEMP/sql-candidate-private/rows.xml" --output var/sql-candidate-proof/rows-outcomes.json
      - name: Require current-head isolated RD and OE proofs without runtime promotion
        env:
          MINEAGENT_SQL_CANDIDATE_MEASUREMENT_GROUP: current
        if: ${{ !cancelled() && steps.source_contracts.outcome == 'success' && steps.candidate_postgres.outcome == 'success' }}
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          files=(tests/sql_probes/test_rd_v3_probe_sql.py tests/sql_probes/test_row_validation_oe_032g_sql.py tests/integration/test_rd_v3_invariant_probe.py tests/integration/test_rd_v3_queued_graph_probe.py tests/integration/test_row_validation_oe_032g.py)
          python -m pytest "${files[@]}" --collect-only -q -p no:cacheprovider > "$RUNNER_TEMP/sql-candidate-private/current-collection.txt"
          python -m pytest "${files[@]}" -q -p no:cacheprovider --junitxml="$RUNNER_TEMP/sql-candidate-private/current.xml"
          python script/sql_candidate_proof.py --group current --collection "$RUNNER_TEMP/sql-candidate-private/current-collection.txt" --junit "$RUNNER_TEMP/sql-candidate-private/current.xml" --output var/sql-candidate-proof/current-outcomes.json
      - name: Require isolated per-event trigger dispatch proof without native claims
        if: ${{ !cancelled() && steps.source_contracts.outcome == 'success' && steps.candidate_postgres.outcome == 'success' }}
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          files=(tests/sql_probes/test_oe_trigger_target_probe_sql.py tests/integration/test_oe_trigger_target_probe.py)
          python -m pytest "${files[@]}" --collect-only -q -p no:cacheprovider > "$RUNNER_TEMP/sql-candidate-private/trigger-collection.txt"
          python -m pytest "${files[@]}" -q -p no:cacheprovider --junitxml="$RUNNER_TEMP/sql-candidate-private/trigger.xml"
          python script/sql_candidate_proof.py --group trigger --collection "$RUNNER_TEMP/sql-candidate-private/trigger-collection.txt" --junit "$RUNNER_TEMP/sql-candidate-private/trigger.xml" --output var/sql-candidate-proof/trigger-outcomes.json
      - name: Require read-only installed heartbeat catalog evidence without equivalence claims
        if: ${{ !cancelled() && steps.source_contracts.outcome == 'success' && steps.candidate_postgres.outcome == 'success' }}
        timeout-minutes: 3
        env:
          MINEAGENT_HEARTBEAT_INVENTORY_DIR: var/sql-candidate-proof
        shell: bash
        run: |
          set -euo pipefail
          files=(tests/sql_probes/test_heartbeat_graph_inventory_source.py tests/integration/test_heartbeat_graph_inventory.py)
          python -m pytest "${files[@]}" --collect-only -q -p no:cacheprovider > "$RUNNER_TEMP/sql-candidate-private/heartbeat-collection.txt"
          python -m pytest "${files[@]}" -q -p no:cacheprovider --junitxml="$RUNNER_TEMP/sql-candidate-private/heartbeat.xml"
          python script/sql_candidate_proof.py --group heartbeat_inventory --collection "$RUNNER_TEMP/sql-candidate-private/heartbeat-collection.txt" --junit "$RUNNER_TEMP/sql-candidate-private/heartbeat.xml" --output var/sql-candidate-proof/heartbeat-inventory-outcomes.json
      - name: Require pure canonical text reuse differential without runtime activation
        id: pure_canonical
        if: ${{ !cancelled() && steps.source_contracts.outcome == 'success' && steps.candidate_postgres.outcome == 'success' }}
        timeout-minutes: 5
        env:
          MINEAGENT_PURE_CANONICAL_REUSE_REQUIRED: "1"
        shell: bash
        run: |
          set -euo pipefail
          files=(tests/sql_probes/test_canonical_text_reuse_source.py tests/sql_probes/test_canonical_text_reuse_workflow.py tests/integration/test_canonical_text_reuse_probe.py::test_pure_canonical_original_candidate_restored_differential tests/integration/test_canonical_text_reuse_probe.py::test_pure_canonical_preflight_rejects_helper_cost_drift tests/integration/test_canonical_text_reuse_probe.py::test_pure_canonical_cached_text_hash_helper_equivalence)
          python -m pytest "${files[@]}" --collect-only -q -p no:cacheprovider > "$RUNNER_TEMP/sql-candidate-private/pure-canonical-collection.txt"
          python -m pytest "${files[@]}" -q -p no:cacheprovider --junitxml="$RUNNER_TEMP/sql-candidate-private/pure-canonical.xml"
          python script/sql_candidate_proof.py --group pure_canonical --collection "$RUNNER_TEMP/sql-candidate-private/pure-canonical-collection.txt" --junit "$RUNNER_TEMP/sql-candidate-private/pure-canonical.xml" --output var/sql-candidate-proof/pure-canonical-outcomes.json
      - name: Record separate bounded pure canonical SQL cost without native claims
        if: ${{ !cancelled() && steps.source_contracts.outcome == 'success' && steps.candidate_postgres.outcome == 'success' && steps.pure_canonical.outcome == 'success' }}
        timeout-minutes: 5
        env:
          MINEAGENT_PURE_CANONICAL_REUSE_REQUIRED: "1"
        shell: bash
        run: |
          set -euo pipefail
          files=(tests/integration/test_canonical_text_reuse_probe.py::test_pure_canonical_bounded_sql_cost_observation)
          python -m pytest "${files[@]}" --collect-only -q -p no:cacheprovider > "$RUNNER_TEMP/sql-candidate-private/pure-canonical-cost-collection.txt"
          python -m pytest "${files[@]}" -q -p no:cacheprovider --junitxml="$RUNNER_TEMP/sql-candidate-private/pure-canonical-cost.xml"
          python script/sql_candidate_proof.py --group pure_canonical_cost --collection "$RUNNER_TEMP/sql-candidate-private/pure-canonical-cost-collection.txt" --junit "$RUNNER_TEMP/sql-candidate-private/pure-canonical-cost.xml" --output var/sql-candidate-proof/pure-canonical-cost-outcomes.json
      - name: Always remove only this job's exact owned PostgreSQL service
        if: always()
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/sql-candidate-private/postgres.cid"
          if [ -f "$file" ]; then
            cid=$(cat "$file")
            [[ "$cid" =~ ^[a-f0-9]{64}$ ]]
            actual=$(docker inspect --format '{{.Id}}|{{.Name}}|{{index .Config.Labels "io.mineagent.sql-candidate"}}' "$cid")
            test "$actual" = "$cid|/mineagent-sql-candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT|$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            # Bounded, non-secret capacity evidence even when PostgreSQL is in recovery.
            if ! timeout 10s docker inspect --format '{{.State.OOMKilled}}|{{.State.ExitCode}}' "$cid" > var/sql-candidate-proof/postgres-exit.txt; then
              printf 'container state observation unavailable\n' >> var/sql-candidate-proof/postgres-exit.txt
            fi
            if ! timeout 10s docker exec "$cid" df -Pk /var/lib/postgresql > var/sql-candidate-proof/postgres-capacity.txt; then
              printf 'capacity observation unavailable\n' >> var/sql-candidate-proof/postgres-capacity.txt
            fi
            docker rm --force --volumes "$cid" >/dev/null
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mineagent-isolated-sql-candidates-${{ github.sha }}
          path: var/sql-candidate-proof/
          if-no-files-found: error
          retention-days: 14
