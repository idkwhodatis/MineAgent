name: MineAgent isolated SQL candidate proof (not production acceptance)

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - ".github/workflows/mineagent-sql-candidates.yml"
      - "backend/alembic/**"
      - "backend/app/**"
      - "backend/requirements.lock"
      - "compatibility/tradegrad.json"
      - "packages/openevolve_structured/**"
      - "packages/structured_factor_strategy/**"
      - "packages/factors/**"
      - "packages/rdagent_adapter/**"
      - "packages/rdagent_provider/**"
      - "packages/research_inputs/**"
      - "packages/research_workflow/**"
      - "packages/research_runtime/**"
      - "packages/strategy_sdk/**"
      - "script/schema_keyset_candidate.py"
      - "script/sql_candidate_proof.py"
      - "script/sql_candidate_catalog.py"
      - "docs/SQL_CANDIDATE_PROOF.md"
      - "script/bootstrap_tradegrad_compat.py"
      - "tests/rdagent/test_row_validation*"
      - "tests/structured/*sql_candidate*"
      - "tests/structured/test_schema_keyset_candidate.py"
      - "tests/integration/conftest.py"
      - "tests/integration/test_sql_candidate_catalog.py"
      - "tests/integration/test_row_validation*"
      - "tests/integration/test_schema_keyset_candidate.py"
      - "tests/integration/test_rdagent_validation_performance.py"
      - "tests/integration/test_schema_reference_cost.py"
      - "tests/openevolve/test_structured_persisted_identity.py"
      - "tests/openevolve/test_workflow_prompt.py"
      - "tests/structured/test_engine_oracle.py"
      - "tests/structured/test_operator.py"
      - "tests/structured/test_views.py"
      - "tests/openevolve/test_workflow_run.py"
      - "tests/rdagent/test_rdagent_workflow_child_contracts.py"
      - "tests/rdagent/test_rdagent_canonical_sql.py"
      - "tests/research_workflow/test_plan.py"
      - "tests/integration/workflow_oe_sql_fixture.py"
      - "tests/integration/rd_configured_dataset_fixture.py"
      - "tests/integration/rd_submission_fixture.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-candidates:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      DATA_PROVIDER_MODE: fixture
      E2E_LIVE_PROVIDERS: "0"
      MODEL_PROFILES_ENABLED: "false"
      MINEAGENT_SQL_COST_BENCHMARK: "1"
      MINEAGENT_SQL_CANDIDATE_CATALOG_DIR: var/sql-candidate-proof
      MINEAGENT_SQL_CANDIDATE_MEASUREMENTS_DIR: var/sql-candidate-proof
      POSTGRES_USER: tradegrad_ci
      POSTGRES_DB: tradegrad_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Materialize unchanged compatibility sources
        run: python script/bootstrap_tradegrad_compat.py
      - name: Install pinned existing backend test closure
        run: python -m pip install --require-hashes -r backend/requirements.lock
      - name: Record exact commit tree and tracked source hashes
        run: python script/sql_candidate_proof.py --source-evidence --output var/sql-candidate-proof/source.json
      - name: Require exact source-only candidate contracts
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sql-candidate-private"
          files=(tests/rdagent/test_row_validation_invariant_sql.py tests/rdagent/test_row_validation_content_sql.py tests/structured/test_schema_keyset_candidate.py tests/structured/test_sql_candidate_workflow.py tests/structured/test_sql_candidate_harness.py)
          python -m pytest "${files[@]}" --collect-only -q -p no:cacheprovider > "$RUNNER_TEMP/sql-candidate-private/source-collection.txt"
          python -m pytest "${files[@]}" -q -p no:cacheprovider --junitxml="$RUNNER_TEMP/sql-candidate-private/source.xml"
          python script/sql_candidate_proof.py --group source --collection "$RUNNER_TEMP/sql-candidate-private/source-collection.txt" --junit "$RUNNER_TEMP/sql-candidate-private/source.xml" --output var/sql-candidate-proof/source-outcomes.json
      - name: Start only an owned disposable PostgreSQL 18.6 service
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          password=$(python -c 'import secrets; print(secrets.token_hex(32))')
          echo "::add-mask::$password"
          export POSTGRES_PASSWORD="$password"
          name="mineagent-sql-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run --detach --name "$name" --cidfile "$RUNNER_TEMP/sql-candidate-private/postgres.cid" \
            --label "io.mineagent.sql-candidate=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --publish 127.0.0.1::5432 --env POSTGRES_USER --env POSTGRES_PASSWORD --env POSTGRES_DB \
            --memory 2g --memory-swap 2g --cpus 2 --pids-limit 128 \
            --tmpfs /var/lib/postgresql:rw,size=1g,nosuid \
            --health-cmd 'pg_isready -h 127.0.0.1 -U tradegrad_ci -d tradegrad_ci' \
            --health-interval 2s --health-timeout 5s --health-retries 30 \
            postgres:18.6 -c track_functions=pl -c statement_timeout=10000 -c lock_timeout=5000 >/dev/null
          cid=$(cat "$RUNNER_TEMP/sql-candidate-private/postgres.cid")
          for attempt in $(seq 1 90); do
            state=$(docker inspect --format '{{.State.Health.Status}}' "$cid")
            if [ "$state" = healthy ]; then break; fi
            if [ "$state" = unhealthy ]; then exit 1; fi
            sleep 1
          done
          test "$state" = healthy
          endpoint=$(docker port "$cid" 5432/tcp)
          [[ "$endpoint" =~ ^127\.0\.0\.1:([0-9]+)$ ]]
          port="${BASH_REMATCH[1]}"
          printf 'TEST_DATABASE_URL=postgresql+psycopg://%s:%s@127.0.0.1:%s/%s\n' "$POSTGRES_USER" "$password" "$port" "$POSTGRES_DB" >> "$GITHUB_ENV"
          docker exec "$cid" psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc "SELECT version(); SHOW statement_timeout; SHOW lock_timeout; SHOW track_functions;" > var/sql-candidate-proof/postgres.txt
      - name: Require 11 key-set PostgreSQL cases including the bounded component benchmark
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest tests/integration/test_schema_keyset_candidate.py --collect-only -q -p no:cacheprovider > "$RUNNER_TEMP/sql-candidate-private/keyset-collection.txt"
          python -m pytest tests/integration/test_schema_keyset_candidate.py -q -p no:cacheprovider --junitxml="$RUNNER_TEMP/sql-candidate-private/keyset.xml"
          python script/sql_candidate_proof.py --group keyset --collection "$RUNNER_TEMP/sql-candidate-private/keyset-collection.txt" --junit "$RUNNER_TEMP/sql-candidate-private/keyset.xml" --output var/sql-candidate-proof/keyset-outcomes.json
      - name: Require pristine catalog and 32 independent row-CHECK PostgreSQL cases
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          files=(tests/integration/test_sql_candidate_catalog.py tests/integration/test_row_validation_invariants.py tests/integration/test_row_validation_content.py)
          python -m pytest "${files[@]}" --collect-only -q -p no:cacheprovider > "$RUNNER_TEMP/sql-candidate-private/rows-collection.txt"
          python -m pytest "${files[@]}" -q -p no:cacheprovider --junitxml="$RUNNER_TEMP/sql-candidate-private/rows.xml"
          python script/sql_candidate_proof.py --group rows --collection "$RUNNER_TEMP/sql-candidate-private/rows-collection.txt" --junit "$RUNNER_TEMP/sql-candidate-private/rows.xml" --output var/sql-candidate-proof/rows-outcomes.json
      - name: Always remove only this job's exact owned PostgreSQL service
        if: always()
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/sql-candidate-private/postgres.cid"
          if [ -f "$file" ]; then
            cid=$(cat "$file")
            [[ "$cid" =~ ^[a-f0-9]{64}$ ]]
            actual=$(docker inspect --format '{{.Id}}|{{.Name}}|{{index .Config.Labels "io.mineagent.sql-candidate"}}' "$cid")
            test "$actual" = "$cid|/mineagent-sql-candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT|$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            docker rm --force --volumes "$cid" >/dev/null
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mineagent-isolated-sql-candidates-${{ github.sha }}
          path: var/sql-candidate-proof/
          if-no-files-found: error
          retention-days: 14
