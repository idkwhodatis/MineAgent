name: MineAgent reverse-proxy subpath acceptance
on:
  push:
    branches: [master]
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "infra/**"
      - "script/**"
      - "tests/mineagent/**"
      - ".github/workflows/mineagent-subpath.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  caddy-root-and-subpath:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      E2E_EMAIL: subpath@example.com
      E2E_LIVE_PROVIDERS: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      MINEAGENT_SUBPATH_ACCEPTANCE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Materialize exact compatibility sources
        run: python script/bootstrap_tradegrad_compat.py
      - name: Generate masked job-local synthetic credentials
        run: python script/ci_test_environment.py
      - name: Install frozen test dependencies
        run: |
          python -m pip install --require-hashes -r backend/requirements.lock
          npm ci --prefix frontend
          cd frontend && npx playwright install --with-deps chromium
      - name: Verify acceptance guard contracts
        run: python -m pytest tests/mineagent/test_subpath_acceptance.py -q
      - name: Build once and verify real Caddy root and nested runtime mounts
        run: python -m script.subpath_acceptance
      - name: Upload outcome-only exact-head evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mineagent-subpath-${{ github.sha }}
          path: var/subpath-acceptance.json
          if-no-files-found: error
          retention-days: 7
