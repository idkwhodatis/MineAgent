name: MineAgent independent populated workflow baseline

# Runs the existing formerly downstream gate independently of earlier failures.
# No SQL candidate is activated and the original acceptance workflow is unchanged.
on:
  push:
    branches: [master]
  pull_request:
    paths:
      - ".github/workflows/mineagent-workflow-populated-proof.yml"
      - ".github/workflows/mineagent-structured-factor.yml"
      - "tests/sql_probes/test_workflow_populated_proof.py"
      - "backend/alembic/**"
      - "backend/app/*sql.py"
      - "tests/integration/*workflow*"
      - "tests/integration/oe_structured*"
      - "tests/integration/rd_configured*"
      - "script/ci_pg_client.py"
      - "tests/integration/rd_completed_graph_probe.py"
      - "tests/sql_probes/test_rd_completed_graph_probe_source.py"
      - "tests/sql_probes/test_heartbeat_schema_inventory_source.py"
      - "tests/sql_probes/test_rd_attempt_admission_candidate.py"
      - "tests/sql_probes/test_workflow_heartbeat_admission_source.py"
      - "tests/integration/test_rd_admission_expiry_observation.py"
      - "tests/sql_probes/rd_admission_expiry_observation.py"
      - "tests/sql_probes/test_rd_admission_expiry_observation_unit.py"
      - "tests/sql_probes/test_rd_admission_expiry_observation_source.py"
      - "tests/integration/test_rd_admission_expiry_roles.py"
      - "tests/sql_probes/test_rd_admission_expiry_roles_unit.py"
      - "tests/sql_probes/rd_ticketed_admission_candidate.py"
      - "tests/sql_probes/test_rd_ticketed_admission_candidate.py"
      - "tests/sql_probes/rd_native_admission_trial.py"
      - "tests/sql_probes/test_rd_native_admission_trial.py"
      - "tests/sql_probes/test_rd_timeline_diagnostic.py"
      - "tests/integration/rd_timeline_diagnostic.py"
      - "tests/integration/test_reverse_heartbeat_candidate.py"
      - "tests/sql_probes/reverse_heartbeat_candidate.py"
      - "tests/sql_probes/reverse_heartbeat_candidate_pins.json"
      - "tests/sql_probes/test_reverse_heartbeat_candidate_source.py"
      - "tests/sql_probes/rd_attempt_admission_candidate.py"
      - "tests/sql_probes/test_workflow_heartbeat_lock_order_source.py"
      - "tests/structured/sql_candidate_inventory.json"
      - "script/sql_candidate_proof.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  populated-workflow-baseline:
    runs-on: ubuntu-22.04
    # Independent unchanged finite-workflow baseline, not full production acceptance.
    # Individual protected process deadlines remain unchanged.
    timeout-minutes: 120
    env:
      POSTGRES_USER: tradegrad_ci
      POSTGRES_DB: tradegrad_ci
      DATA_PROVIDER_MODE: fixture
      E2E_LIVE_PROVIDERS: "0"
      MODEL_PROFILES_ENABLED: "false"
      MINEAGENT_RD_CONTROLLER_REQUIRED: "1"
      MINEAGENT_CONFIGURED_ANALYSIS_REQUIRED: "1"
      MINEAGENT_STRUCTURED_ENGINE_REQUIRED: "1"
      MINEAGENT_STRUCTURED_BROWSER_REQUIRED: "1"
      RUN_BACKUP_RESTORE_DRILL: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Materialize unchanged legacy compatibility sources
        run: python script/bootstrap_tradegrad_compat.py
      - name: Install unchanged host test closure
        run: python -m pip install --require-hashes -r backend/requirements.lock
      - name: Require independent baseline source contract
        run: python -m pytest tests/sql_probes/test_workflow_populated_proof.py tests/rdagent/test_rpc_stage_diagnostic.py tests/sql_probes/test_rd_completed_graph_probe_source.py tests/sql_probes/test_workflow_heartbeat_lock_order_source.py tests/sql_probes/test_heartbeat_schema_inventory_source.py tests/sql_probes/test_rd_attempt_admission_candidate.py tests/sql_probes/test_workflow_heartbeat_admission_source.py tests/sql_probes/test_rd_admission_expiry_observation_unit.py tests/sql_probes/test_rd_admission_expiry_observation_source.py tests/sql_probes/test_rd_admission_expiry_roles_unit.py tests/sql_probes/test_rd_ticketed_admission_candidate.py tests/sql_probes/test_rd_native_admission_trial.py tests/sql_probes/test_rd_timeline_diagnostic.py tests/sql_probes/test_reverse_heartbeat_candidate_source.py -q
      - name: Require host identity and diagnostic regressions
        run: |
          mkdir -p var/numeric-private var/numeric-proof
          python -m pytest tests/openevolve/test_structured_daemon_members.py tests/openevolve/test_structured_peer_members.py tests/structured_controller_runtime/test_peer.py tests/openevolve/test_operational_daemon_identity.py tests/runner/test_oe_receipt_cost_diagnostic.py tests/runner/test_oe_pg_diagnostic.py -q --junitxml=var/numeric-private/peer-identity.xml
          python - <<'PYPEER'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          from script.summarize_ci_junit import summarize
          source=Path('var/numeric-private/peer-identity.xml')
          summarize(source,Path('var/numeric-proof/peer-identity-outcomes.xml'))
          cases=list(ET.parse(source).getroot().iter('testcase'))
          assert len(cases)==178
          assert not any(case.find(tag) is not None for case in cases for tag in ('failure','error','skipped'))
          PYPEER
      - name: Install isolated pinned host SDK without changing API dependencies
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/rd-provider-sdk"
          "$RUNNER_TEMP/rd-provider-sdk/bin/python" -m pip install --require-hashes -r runtimes/rdagent_provider/requirements.lock
          "$RUNNER_TEMP/rd-provider-sdk/bin/python" -m pip check
          printf 'MINEAGENT_PROVIDER_SDK_PYTHON=%s\n' "$RUNNER_TEMP/rd-provider-sdk/bin/python" >> "$GITHUB_ENV"
      - name: Build locked frontend for genuine structured results
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
      - name: Install matched Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Fetch only exact existing numeric wheels
        run: |
          mkdir -p .wheelhouse-factor-numeric var/numeric-proof
          python -m runtimes.factor_execution.verify_inventory > var/numeric-proof/source-inventory.json
          python -m pip download --require-hashes --only-binary=:all: --no-deps -r runtimes/factor_normalizer/requirements.lock -d .wheelhouse-factor-numeric
      - name: Materialize exact pinned base in local Docker daemon
        run: docker pull python:3.12.14-slim-bookworm@sha256:392307d22300de8b5986851a12d9176dfc0fc073e65bf6523ebd7dcbeb23564e
      - name: Build separate fixed candidate and native normalizer images
        run: |
          docker build --iidfile var/numeric-proof/candidate.iid -f runtimes/factor_execution/Dockerfile .
          docker build --iidfile var/numeric-proof/normalizer.iid -f runtimes/factor_normalizer/Dockerfile .
      - name: Verify installed numeric native dependency closures without candidate execution
        run: |
          for role in candidate normalizer; do
            docker run --rm --network none --ipc none --read-only --cap-drop ALL \
              --security-opt no-new-privileges --user 65533:65533 --pids-limit 32 \
              --memory 256m --memory-swap 256m --cpus 1 \
              --tmpfs /tmp:rw,noexec,nosuid,nodev,size=4m,uid=65533,gid=65533,mode=0700 \
              --entrypoint python "$(cat var/numeric-proof/$role.iid)" \
              -I -m runtimes.factor_execution.probe_dependencies "$role" \
              > "var/numeric-proof/$role-dependencies.json"
          done
      - name: Reproduce exact installed controller wheels
        shell: bash
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/rd-controller-upstream"
          git init "$source"
          git -C "$source" fetch --depth 1 https://github.com/microsoft/RD-Agent.git 484776c211e4fbbeef03e0ec00d6bbee7362a4f4
          git -C "$source" checkout --detach FETCH_HEAD
          test "$(git -C "$source" rev-parse HEAD)" = 484776c211e4fbbeef03e0ec00d6bbee7362a4f4
          python runtimes/rdagent/build_profile.py --source "$source" --output .runtime/rdagent-wheels
          cmp .runtime/rdagent-wheels/build-report.json runtimes/rdagent/wheel-proof.json
          python -m runtimes.rdagent_operational.build_profile --output .runtime/rdagent-operational-wheels
          python -m runtimes.rdagent_operational.build_profile --output "$RUNNER_TEMP/controller-build-two"
          cmp .runtime/rdagent-operational-wheels/operational-build-report.json "$RUNNER_TEMP/controller-build-two/operational-build-report.json"
          cmp .runtime/rdagent-operational-wheels/operational-build-report.json runtimes/rdagent_operational/wheel-proof.json
          cp .runtime/rdagent-operational-wheels/operational-build-report.json var/numeric-proof/
          docker build --iidfile var/numeric-proof/orchestrator.iid -f runtimes/rdagent_operational/Dockerfile .
      - name: Reproduce exact accepted installed Qlib parent
        shell: bash
        run: |
          set -euo pipefail
          qlib="$RUNNER_TEMP/analysis-qlib-upstream"
          git init "$qlib"
          git -C "$qlib" fetch --depth 1 https://github.com/microsoft/qlib.git 54355232463878d2eebb91fe0ee5fa7fa1f5976c
          git -C "$qlib" checkout --detach FETCH_HEAD
          test "$(git -C "$qlib" rev-parse HEAD)" = 54355232463878d2eebb91fe0ee5fa7fa1f5976c
          python -I runtimes/qlib/verify_build.py materialize "$qlib" --inventory runtimes/qlib/source-inventory.json --destination .runtime/qlib-source
          python runtimes/qlib/build_runner_profile.py --source "$RUNNER_TEMP/rd-controller-upstream" --output .runtime/qlib-wheels
          python -I runtimes/qlib/verify_build.py profile .runtime/qlib-wheels --inventory runtimes/qlib/wheel-proof.json
          docker build --iidfile var/numeric-proof/qlib-installed.iid -f runtimes/qlib/Dockerfile .
      - name: Build no-network derivative analysis image without installing dependencies
        shell: bash
        run: |
          set -euo pipefail
          parent=$(cat var/numeric-proof/qlib-installed.iid)
          [[ "$parent" =~ ^sha256:[a-f0-9]{64}$ ]]
          parent_ref="mineagent-local-parent:${parent#sha256:}"
          docker tag "$parent" "$parent_ref"
          test "$(docker image inspect --format '{{.Id}}' "$parent_ref")" = "$parent"
          docker build --pull=false --network none --build-arg "QLIB_IMAGE=$parent_ref" --iidfile var/numeric-proof/analysis.iid -f runtimes/qlib/Dockerfile.direct .
          test "$(docker image inspect --format '{{.Id}}' "$parent_ref")" = "$parent"
      - name: Verify installed parent direct Qlib mathematics without host native imports
        shell: bash
        run: |
          set -euo pipefail
          parent=$(cat var/numeric-proof/qlib-installed.iid)
          mkdir -p var/numeric-private
          cleanup() {
            file=var/numeric-private/qlib-proof.cid
            [ -f "$file" ] && [ ! -L "$file" ] || return
            cid=$(cat "$file")
            [[ "$cid" =~ ^[a-f0-9]{64}$ ]] || return 1
            actual=$(timeout 15s docker inspect --format '{{.Id}}|{{.Name}}|{{.Image}}' "$cid")
            test "$actual" = "$cid|/mineagent-qlib-direct-installation-proof|$parent"
            timeout 30s docker rm --force "$cid" >/dev/null
          }
          trap cleanup EXIT
          timeout 120s docker run --cidfile var/numeric-private/qlib-proof.cid \
            --name mineagent-qlib-direct-installation-proof \
            --network none --ipc none --read-only --cap-drop ALL \
            --env OPENBLAS_NUM_THREADS=1 --env MKL_NUM_THREADS=1 \
            --security-opt no-new-privileges --user 65532:65532 --pids-limit 32 \
            --memory 512m --memory-swap 512m --cpus 1 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=4m,uid=65532,gid=65532,mode=0700 \
            --entrypoint /opt/qlib/bin/python "$parent" -I -m runtimes.qlib.verify_direct \
            > var/numeric-proof/qlib-installed-direct.json
      - name: Generate masked disposable database credentials
        run: python script/ci_test_environment.py
      - name: Start exact disposable PostgreSQL for composed persisted numeric gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p var/numeric-private
          docker run --detach --name tradegrad-ci-postgres --cidfile "$GITHUB_WORKSPACE/var/numeric-private/postgres.cid" \
            --label io.mineagent.ci=numeric-postgres --label io.tradegrad.ci=postgres --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_USER --env POSTGRES_PASSWORD --env POSTGRES_DB \
            --tmpfs /var/lib/postgresql:rw,size=2g,nosuid \
            --health-cmd 'pg_isready -h 127.0.0.1 -U tradegrad_ci -d tradegrad_ci' \
            --health-interval 2s --health-timeout 5s --health-retries 30 postgres:18.6 -c track_functions=pl >/dev/null
          for attempt in $(seq 1 90); do
            state=$(docker inspect --format '{{.State.Health.Status}}' tradegrad-ci-postgres)
            if [ "$state" = healthy ]; then exit 0; fi
            if [ "$state" = unhealthy ]; then break; fi
            sleep 1
          done
          echo 'Disposable PostgreSQL was not healthy' >&2
          exit 1
      - name: Bind streaming backup clients to the exact disposable PostgreSQL container
        run: |
          python - <<'PYCLIENT'
          import os, pathlib, re, shlex, subprocess, sys
          container = pathlib.Path("var/numeric-private/postgres.cid").read_text().strip()
          if not re.fullmatch(r"[0-9a-f]{64}", container):
              raise SystemExit("Invalid disposable service identity")
          actual = subprocess.check_output(["docker", "inspect", "--format", "{{.Id}}", container], text=True, timeout=10).strip()
          if actual != container:
              raise SystemExit("Disposable service identity changed")
          root = pathlib.Path("var/ci-pg").resolve()
          root.mkdir(parents=True, mode=0o700, exist_ok=False)
          config = root / "docker-config"
          config.mkdir(mode=0o700)
          (config / "config.json").write_text('{"auths":{}}')
          script = pathlib.Path("script/ci_pg_client.py").resolve()
          for tool in ("pg_dump", "pg_restore"):
              executable = root / tool
              executable.write_text(
                  "#!/bin/sh\nGITHUB_ACTIONS=true TRADEGRAD_CI_POSTGRES_ID=" + container
                  + " DOCKER_CONFIG=" + shlex.quote(str(config))
                  + " exec " + shlex.quote(sys.executable) + " " + shlex.quote(str(script))
                  + " " + tool + ' "$@"\n'
              )
              executable.chmod(0o700)
              with open(os.environ["GITHUB_ENV"], "a") as stream:
                  print(tool.upper() + "_EXECUTABLE=" + str(executable), file=stream)
          PYCLIENT
      # The first existing ten-unit case invokes the exact-one Chromium harness
      # before release; its raw JUnit stays private. The second is real cold restore.
      - name: Build measured unchanged trusted engine and closed derivative
        run: |
          set -euo pipefail
          digest=$(python -m packages.tradegrad_adapter.portable_environment)
          docker build --build-arg "TRADEGRAD_ENVIRONMENT_DIGEST=$digest" --iidfile var/numeric-proof/structured-parent.iid -f runtimes/portable_engine/Dockerfile .
          parent=$(cat var/numeric-proof/structured-parent.iid)
          [[ "$parent" =~ ^sha256:[0-9a-f]{64}$ ]]
          parent_ref="mineagent-local-parent:${parent#sha256:}"
          docker tag "$parent" "$parent_ref"
          test "$(docker image inspect --format '{{.Id}}' "$parent_ref")" = "$parent"
          docker build --pull=false --network none --build-arg "TRUSTED_ENGINE_IMAGE=$parent_ref" --iidfile var/numeric-proof/structured.iid -f runtimes/structured_factor_engine/Dockerfile .
          test "$(docker image inspect --format '{{.Id}}' "$parent_ref")" = "$parent"
      - name: Build exact installed OE parent and normal no-network derivatives
        shell: bash
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/openevolve-upstream"
          git init "$source"
          git -C "$source" fetch --depth 1 https://github.com/algorithmicsuperintelligence/openevolve.git 8c65f74aa906abc0b0e9cae948ddf4c4c6570bdc
          git -C "$source" checkout --detach FETCH_HEAD
          test "$(git -C "$source" rev-parse HEAD)" = 8c65f74aa906abc0b0e9cae948ddf4c4c6570bdc
          python runtimes/openevolve/materialize_source.py --source "$source" --destination .runtime/openevolve-source
          python runtimes/openevolve/verify_build_inputs.py .runtime/openevolve-source
          docker build --iidfile var/numeric-proof/oe-controller-parent.iid -f runtimes/openevolve_operational/Dockerfile .
          python -m script.build_oe_structured_images --output var/numeric-proof/oe-normal \
            --controller-parent "$(cat var/numeric-proof/oe-controller-parent.iid)" \
            --engine-parent "$(cat var/numeric-proof/structured-parent.iid)"
      - name: Record successful native baseline setup
        id: native_setup
        run: echo "Native baseline setup complete"
      - name: Require actual finite workflow RD to OE stage and complete restore
        timeout-minutes: 40
        shell: bash
        env:
          MINEAGENT_WORKFLOW_STRUCTURED_FLOW_REQUIRED: "1"
          MINEAGENT_RD_WORKFLOW_BROWSER_REQUIRED: "1"
          MINEAGENT_OE_STRUCTURED_NORMAL_REQUIRED: "1"
          MINEAGENT_OE_NORMAL_BROWSER_REQUIRED: "1"
        run: |
          set -euo pipefail
          export MINEAGENT_CANDIDATE_IMAGE="$(cat var/numeric-proof/candidate.iid)"
          export MINEAGENT_NORMALIZER_IMAGE="$(cat var/numeric-proof/normalizer.iid)"
          export MINEAGENT_ORCHESTRATOR_IMAGE="$(cat var/numeric-proof/orchestrator.iid)"
          export MINEAGENT_ANALYSIS_IMAGE="$(cat var/numeric-proof/analysis.iid)"
          export MINEAGENT_QLIB_INSTALLED_IMAGE="$(cat var/numeric-proof/qlib-installed.iid)"
          export MINEAGENT_OE_STRUCTURED_RUNTIME_PROFILE="$(cat var/numeric-proof/oe-normal/oe-structured-runtime-profile.json)"
          status=0
          python -m pytest tests/integration/test_workflow_structured_stage_flow.py -q \
            --junitxml=var/numeric-private/workflow-structured-stage.xml || status=$?
          python - <<'PYRESULT'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          from script.summarize_ci_junit import summarize
          source=Path('var/numeric-private/workflow-structured-stage.xml')
          summarize(source,Path('var/numeric-proof/workflow-structured-stage-outcomes.xml'))
          cases=list(ET.parse(source).getroot().iter('testcase'))
          assert len(cases)==1
          assert {case.get('name') for case in cases}=={'test_actual_final_rd_checkpoint_drives_one_oe_stage_and_exact031_restore'}
          assert not any(case.find(tag) is not None for case in cases for tag in ('failure','error','skipped'))
          PYRESULT
          test "$status" = 0
      - name: Require clean native units before current schema baseline
        id: current_baseline_containment
        if: ${{ !cancelled() && steps.native_setup.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          ids=$(timeout 15s docker ps --all --quiet --no-trunc --filter label=io.mineagent.managed=mineagent-oe-structured-orchestrator-v1)
          test -z "$ids" || { echo 'Normal OE controller containment is not confirmed' >&2; exit 1; }
          ids=$(timeout 15s docker ps --all --quiet --no-trunc --filter label=io.mineagent.structured.admission)
          test -z "$ids" || { echo 'Structured engine containment is not confirmed' >&2; exit 1; }
          ids=$(timeout 15s docker ps --all --quiet --no-trunc --filter label=io.mineagent.numeric.admission)
          test -z "$ids" || { echo 'Numeric unit containment is not confirmed' >&2; exit 1; }
          ids=$(timeout 15s docker ps --all --quiet --no-trunc --filter label=io.mineagent.analysis.admission)
          test -z "$ids" || { echo 'Analysis unit containment is not confirmed' >&2; exit 1; }
          ids=$(timeout 15s docker ps --all --quiet --no-trunc --filter label=io.mineagent.managed=mineagent-rdagent-orchestrator-v2)
          test -z "$ids" || { echo 'Controller unit containment is not confirmed' >&2; exit 1; }
          ids=$(timeout 15s docker ps --all --quiet --no-trunc --filter 'name=^/mineagent-qlib-direct-installation-proof$')
          test -z "$ids" || { echo 'Installed parent proof cleanup is not confirmed' >&2; exit 1; }
      - name: Require real finite workflow heartbeat lock order evidence
        if: ${{ !cancelled() && steps.native_setup.outcome == 'success' && steps.current_baseline_containment.outcome == 'success' }}
        timeout-minutes: 10
        shell: bash
        env:
          MINEAGENT_HEARTBEAT_ORDER_REQUIRED: "1"
        run: |
          set -euo pipefail
          export MINEAGENT_CANDIDATE_IMAGE="$(cat var/numeric-proof/candidate.iid)"
          export MINEAGENT_NORMALIZER_IMAGE="$(cat var/numeric-proof/normalizer.iid)"
          export MINEAGENT_ORCHESTRATOR_IMAGE="$(cat var/numeric-proof/orchestrator.iid)"
          export MINEAGENT_ANALYSIS_IMAGE="$(cat var/numeric-proof/analysis.iid)"
          export MINEAGENT_QLIB_INSTALLED_IMAGE="$(cat var/numeric-proof/qlib-installed.iid)"
          export MINEAGENT_OE_STRUCTURED_RUNTIME_PROFILE="$(cat var/numeric-proof/oe-normal/oe-structured-runtime-profile.json)"
          python -m pytest tests/integration/test_workflow_heartbeat_lock_order.py --collect-only -q -p no:cacheprovider > var/numeric-private/heartbeat-order-collection.txt
          python -m pytest tests/integration/test_workflow_heartbeat_lock_order.py -q -p no:cacheprovider --junitxml=var/numeric-private/heartbeat-order.xml
          python script/sql_candidate_proof.py --group heartbeat_order --collection var/numeric-private/heartbeat-order-collection.txt --junit var/numeric-private/heartbeat-order.xml --output var/numeric-proof/heartbeat-order-outcomes.json
      - name: Require isolated local admission candidate evidence
        id: heartbeat_admission
        if: ${{ !cancelled() && steps.native_setup.outcome == 'success' && steps.current_baseline_containment.outcome == 'success' }}
        timeout-minutes: 20
        shell: bash
        env:
          MINEAGENT_HEARTBEAT_ADMISSION_CANDIDATE_REQUIRED: "1"
        run: |
          set -euo pipefail
          export MINEAGENT_CANDIDATE_IMAGE="$(cat var/numeric-proof/candidate.iid)"
          export MINEAGENT_NORMALIZER_IMAGE="$(cat var/numeric-proof/normalizer.iid)"
          export MINEAGENT_ORCHESTRATOR_IMAGE="$(cat var/numeric-proof/orchestrator.iid)"
          export MINEAGENT_ANALYSIS_IMAGE="$(cat var/numeric-proof/analysis.iid)"
          export MINEAGENT_QLIB_INSTALLED_IMAGE="$(cat var/numeric-proof/qlib-installed.iid)"
          export MINEAGENT_OE_STRUCTURED_RUNTIME_PROFILE="$(cat var/numeric-proof/oe-normal/oe-structured-runtime-profile.json)"
          python -m pytest tests/integration/test_workflow_heartbeat_admission_candidate.py --collect-only -q -p no:cacheprovider > var/numeric-private/heartbeat-admission-collection.txt
          python -m pytest tests/integration/test_workflow_heartbeat_admission_candidate.py -q -p no:cacheprovider --junitxml=var/numeric-private/heartbeat-admission.xml
          python script/sql_candidate_proof.py --group heartbeat_admission --collection var/numeric-private/heartbeat-admission-collection.txt --junit var/numeric-private/heartbeat-admission.xml --output var/numeric-proof/heartbeat-admission-outcomes.json
      - name: Require isolated committed expiry observation evidence
        id: heartbeat_observation
        if: ${{ !cancelled() && steps.native_setup.outcome == 'success' && steps.current_baseline_containment.outcome == 'success' }}
        timeout-minutes: 20
        shell: bash
        env:
          MINEAGENT_HEARTBEAT_ADMISSION_CANDIDATE_REQUIRED: "1"
        run: |
          set -euo pipefail
          export MINEAGENT_CANDIDATE_IMAGE="$(cat var/numeric-proof/candidate.iid)"
          export MINEAGENT_NORMALIZER_IMAGE="$(cat var/numeric-proof/normalizer.iid)"
          export MINEAGENT_ORCHESTRATOR_IMAGE="$(cat var/numeric-proof/orchestrator.iid)"
          export MINEAGENT_ANALYSIS_IMAGE="$(cat var/numeric-proof/analysis.iid)"
          export MINEAGENT_QLIB_INSTALLED_IMAGE="$(cat var/numeric-proof/qlib-installed.iid)"
          export MINEAGENT_OE_STRUCTURED_RUNTIME_PROFILE="$(cat var/numeric-proof/oe-normal/oe-structured-runtime-profile.json)"
          python -m pytest tests/integration/test_rd_admission_expiry_observation.py --collect-only -q -p no:cacheprovider > var/numeric-private/heartbeat-observation-collection.txt
          python -m pytest tests/integration/test_rd_admission_expiry_observation.py -q -p no:cacheprovider --junitxml=var/numeric-private/heartbeat-observation.xml
          python script/sql_candidate_proof.py --group heartbeat_observation --collection var/numeric-private/heartbeat-observation-collection.txt --junit var/numeric-private/heartbeat-observation.xml --output var/numeric-proof/heartbeat-observation-outcomes.json
      - name: Require original heartbeat cancellation role evidence
        id: heartbeat_roles
        if: ${{ !cancelled() && steps.native_setup.outcome == 'success' && steps.current_baseline_containment.outcome == 'success' }}
        timeout-minutes: 20
        shell: bash
        env:
          MINEAGENT_HEARTBEAT_ADMISSION_CANDIDATE_REQUIRED: "1"
        run: |
          set -euo pipefail
          export MINEAGENT_CANDIDATE_IMAGE="$(cat var/numeric-proof/candidate.iid)"
          export MINEAGENT_NORMALIZER_IMAGE="$(cat var/numeric-proof/normalizer.iid)"
          export MINEAGENT_ORCHESTRATOR_IMAGE="$(cat var/numeric-proof/orchestrator.iid)"
          export MINEAGENT_ANALYSIS_IMAGE="$(cat var/numeric-proof/analysis.iid)"
          export MINEAGENT_QLIB_INSTALLED_IMAGE="$(cat var/numeric-proof/qlib-installed.iid)"
          export MINEAGENT_OE_STRUCTURED_RUNTIME_PROFILE="$(cat var/numeric-proof/oe-normal/oe-structured-runtime-profile.json)"
          python -m pytest tests/integration/test_rd_admission_expiry_roles.py --collect-only -q -p no:cacheprovider > var/numeric-private/heartbeat-roles-collection.txt
          python -m pytest tests/integration/test_rd_admission_expiry_roles.py -q -p no:cacheprovider --junitxml=var/numeric-private/heartbeat-roles.xml
          python script/sql_candidate_proof.py --group heartbeat_roles --collection var/numeric-private/heartbeat-roles-collection.txt --junit var/numeric-private/heartbeat-roles.xml --output var/numeric-proof/heartbeat-roles-outcomes.json
      - name: Require isolated reverse heartbeat event candidate
        if: ${{ !cancelled() && steps.native_setup.outcome == 'success' && steps.current_baseline_containment.outcome == 'success' }}
        timeout-minutes: 20
        shell: bash
        env:
          MINEAGENT_REVERSE_HEARTBEAT_CANDIDATE_REQUIRED: "1"
          MINEAGENT_HEARTBEAT_ADMISSION_CANDIDATE_REQUIRED: "1"
        run: |
          set -euo pipefail
          export MINEAGENT_CANDIDATE_IMAGE="$(cat var/numeric-proof/candidate.iid)"
          export MINEAGENT_NORMALIZER_IMAGE="$(cat var/numeric-proof/normalizer.iid)"
          export MINEAGENT_ORCHESTRATOR_IMAGE="$(cat var/numeric-proof/orchestrator.iid)"
          export MINEAGENT_ANALYSIS_IMAGE="$(cat var/numeric-proof/analysis.iid)"
          export MINEAGENT_QLIB_INSTALLED_IMAGE="$(cat var/numeric-proof/qlib-installed.iid)"
          export MINEAGENT_OE_STRUCTURED_RUNTIME_PROFILE="$(cat var/numeric-proof/oe-normal/oe-structured-runtime-profile.json)"
          python -m pytest tests/integration/test_reverse_heartbeat_candidate.py --collect-only -q -p no:cacheprovider > var/numeric-private/reverse-heartbeat-collection.txt
          python -m pytest tests/integration/test_reverse_heartbeat_candidate.py -q -p no:cacheprovider --junitxml=var/numeric-private/reverse-heartbeat.xml
          python script/sql_candidate_proof.py --group reverse_heartbeat --collection var/numeric-private/reverse-heartbeat-collection.txt --junit var/numeric-private/reverse-heartbeat.xml --output var/numeric-proof/reverse-heartbeat-outcomes.json
      - name: Require actual current032g finite workflow baseline
        if: ${{ !cancelled() && steps.native_setup.outcome == 'success' && steps.current_baseline_containment.outcome == 'success' }}
        timeout-minutes: 40
        shell: bash
        env:
          MINEAGENT_WORKFLOW_CURRENT_HEAD_REQUIRED: "1"
          MINEAGENT_RD_WORKFLOW_BROWSER_REQUIRED: "1"
          MINEAGENT_OE_STRUCTURED_NORMAL_REQUIRED: "1"
          MINEAGENT_OE_NORMAL_BROWSER_REQUIRED: "1"
        run: |
          set -euo pipefail
          export MINEAGENT_CANDIDATE_IMAGE="$(cat var/numeric-proof/candidate.iid)"
          export MINEAGENT_NORMALIZER_IMAGE="$(cat var/numeric-proof/normalizer.iid)"
          export MINEAGENT_ORCHESTRATOR_IMAGE="$(cat var/numeric-proof/orchestrator.iid)"
          export MINEAGENT_ANALYSIS_IMAGE="$(cat var/numeric-proof/analysis.iid)"
          export MINEAGENT_QLIB_INSTALLED_IMAGE="$(cat var/numeric-proof/qlib-installed.iid)"
          export MINEAGENT_OE_STRUCTURED_RUNTIME_PROFILE="$(cat var/numeric-proof/oe-normal/oe-structured-runtime-profile.json)"
          status=0
          python -m pytest tests/integration/test_workflow_current_head_baseline.py -q \
            --junitxml=var/numeric-private/workflow-current032g-baseline.xml || status=$?
          python - <<'PYRESULT'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          from script.summarize_ci_junit import summarize
          source=Path('var/numeric-private/workflow-current032g-baseline.xml')
          summarize(source,Path('var/numeric-proof/workflow-current032g-baseline-outcomes.xml'))
          cases=list(ET.parse(source).getroot().iter('testcase'))
          assert len(cases)==1
          assert {case.get('name') for case in cases}=={'test_actual_current032g_workflow_completes_with_readonly_graph_checks'}
          assert not any(case.find(tag) is not None for case in cases for tag in ('failure','error','skipped'))
          PYRESULT
          test "$status" = 0
      - name: Require clean native units before isolated scheduling trial
        id: native_trial_containment
        if: ${{ !cancelled() && steps.native_setup.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          ids=$(timeout 15s docker ps --all --quiet --no-trunc --filter label=io.mineagent.managed=mineagent-oe-structured-orchestrator-v1)
          test -z "$ids" || { echo 'Normal OE controller containment is not confirmed' >&2; exit 1; }
          ids=$(timeout 15s docker ps --all --quiet --no-trunc --filter label=io.mineagent.structured.admission)
          test -z "$ids" || { echo 'Structured engine containment is not confirmed' >&2; exit 1; }
          ids=$(timeout 15s docker ps --all --quiet --no-trunc --filter label=io.mineagent.numeric.admission)
          test -z "$ids" || { echo 'Numeric unit containment is not confirmed' >&2; exit 1; }
          ids=$(timeout 15s docker ps --all --quiet --no-trunc --filter label=io.mineagent.analysis.admission)
          test -z "$ids" || { echo 'Analysis unit containment is not confirmed' >&2; exit 1; }
          ids=$(timeout 15s docker ps --all --quiet --no-trunc --filter label=io.mineagent.managed=mineagent-rdagent-orchestrator-v2)
          test -z "$ids" || { echo 'Controller unit containment is not confirmed' >&2; exit 1; }
          ids=$(timeout 15s docker ps --all --quiet --no-trunc --filter 'name=^/mineagent-qlib-direct-installation-proof$')
          test -z "$ids" || { echo 'Installed parent proof cleanup is not confirmed' >&2; exit 1; }
      - name: Require isolated actual workflow scheduling trial
        if: ${{ !cancelled() && steps.native_setup.outcome == 'success' && steps.native_trial_containment.outcome == 'success' && steps.heartbeat_admission.outcome == 'success' && steps.heartbeat_observation.outcome == 'success' && steps.heartbeat_roles.outcome == 'success' }}
        timeout-minutes: 40
        shell: bash
        env:
          MINEAGENT_TICKETED_NATIVE_TRIAL_REQUIRED: "1"
          MINEAGENT_WORKFLOW_CURRENT_HEAD_REQUIRED: "1"
          MINEAGENT_RD_WORKFLOW_BROWSER_REQUIRED: "1"
          MINEAGENT_OE_STRUCTURED_NORMAL_REQUIRED: "1"
          MINEAGENT_OE_NORMAL_BROWSER_REQUIRED: "1"
        run: |
          set -euo pipefail
          export MINEAGENT_CANDIDATE_IMAGE="$(cat var/numeric-proof/candidate.iid)"
          export MINEAGENT_NORMALIZER_IMAGE="$(cat var/numeric-proof/normalizer.iid)"
          export MINEAGENT_ORCHESTRATOR_IMAGE="$(cat var/numeric-proof/orchestrator.iid)"
          export MINEAGENT_ANALYSIS_IMAGE="$(cat var/numeric-proof/analysis.iid)"
          export MINEAGENT_QLIB_INSTALLED_IMAGE="$(cat var/numeric-proof/qlib-installed.iid)"
          export MINEAGENT_OE_STRUCTURED_RUNTIME_PROFILE="$(cat var/numeric-proof/oe-normal/oe-structured-runtime-profile.json)"
          python -m pytest tests/integration/test_workflow_ticketed_admission_trial.py --collect-only -q -p no:cacheprovider > var/numeric-private/heartbeat-native-collection.txt
          status=0
          python -m pytest tests/integration/test_workflow_ticketed_admission_trial.py -q \
            --junitxml=var/numeric-private/workflow-ticketed-native-trial.xml || status=$?
          python - <<'PYRESULT'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          from script.summarize_ci_junit import summarize
          source=Path('var/numeric-private/workflow-ticketed-native-trial.xml')
          summarize(source,Path('var/numeric-proof/workflow-ticketed-native-trial-outcomes.xml'))
          cases=list(ET.parse(source).getroot().iter('testcase'))
          assert len(cases)==1
          assert {case.get('name') for case in cases}=={'test_actual_current032g_workflow_with_ticketed_admission_trial'}
          assert not any(case.find(tag) is not None for case in cases for tag in ('failure','error','skipped'))
          PYRESULT
          test "$status" = 0
          python script/sql_candidate_proof.py --group heartbeat_native --collection var/numeric-private/heartbeat-native-collection.txt --junit var/numeric-private/workflow-ticketed-native-trial.xml --output var/numeric-proof/heartbeat-native-outcomes.json
      - name: Confirm exact normal OE controller units are absent
        if: always()
        run: |
          ids=$(timeout 15s docker ps --all --quiet --no-trunc --filter label=io.mineagent.managed=mineagent-oe-structured-orchestrator-v1)
          test -z "$ids" || { echo 'Normal OE controller containment is not confirmed' >&2; exit 1; }
      - name: Confirm exact structured engine units are absent
        if: always()
        run: |
          ids=$(timeout 15s docker ps --all --quiet --no-trunc --filter label=io.mineagent.structured.admission)
          test -z "$ids" || { echo 'Structured engine containment is not confirmed' >&2; exit 1; }
      - name: Confirm exact numeric units are absent without label-based removal
        if: always()
        run: |
          ids=$(timeout 15s docker ps --all --quiet --no-trunc --filter label=io.mineagent.numeric.admission)
          test -z "$ids" || { echo 'Numeric unit containment is not confirmed' >&2; exit 1; }
      - name: Confirm exact protected analysis units are absent
        if: always()
        run: |
          ids=$(timeout 15s docker ps --all --quiet --no-trunc --filter label=io.mineagent.analysis.admission)
          test -z "$ids" || { echo 'Analysis unit containment is not confirmed' >&2; exit 1; }
      - name: Confirm exact controller units are absent
        if: always()
        run: |
          ids=$(timeout 15s docker ps --all --quiet --no-trunc --filter label=io.mineagent.managed=mineagent-rdagent-orchestrator-v2)
          test -z "$ids" || { echo 'Controller unit containment is not confirmed' >&2; exit 1; }
      - name: Confirm installed-parent proof container is absent
        if: always()
        run: |
          ids=$(timeout 15s docker ps --all --quiet --no-trunc --filter 'name=^/mineagent-qlib-direct-installation-proof$')
          test -z "$ids" || { echo 'Installed parent proof cleanup is not confirmed' >&2; exit 1; }
      - name: Remove only exact disposable numeric PostgreSQL
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          file="$GITHUB_WORKSPACE/var/numeric-private/postgres.cid"
          if [ ! -f "$file" ] || [ -L "$file" ]; then
            ids=$(timeout 15s docker ps --all --quiet --no-trunc --filter label=io.mineagent.ci=numeric-postgres)
            test -z "$ids"
            exit 0
          fi
          id=$(cat "$file")
          [[ "$id" =~ ^[0-9a-f]{64}$ ]]
          actual=$(timeout 15s docker inspect --format '{{.Id}}|{{.Name}}|{{index .Config.Labels "io.mineagent.ci"}}' "$id")
          test "$actual" = "$id|/tradegrad-ci-postgres|numeric-postgres"
          timeout 30s docker rm --force --volumes "$id" >/dev/null
          test -z "$(timeout 15s docker ps --all --quiet --no-trunc --filter "id=$id")"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mineagent-workflow-populated-baseline-${{ github.sha }}
          path: var/numeric-proof/
          if-no-files-found: error
