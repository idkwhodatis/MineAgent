name: MineAgent factor library acceptance

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "packages/factors/**"
      - "runtimes/factor_parser/**"
      - "script/**"
      - "tests/**"
      - ".github/workflows/mineagent-factors.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  factor-library:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      POSTGRES_USER: tradegrad_ci
      POSTGRES_DB: tradegrad_ci
      STORAGE_ROOT: ${{ github.workspace }}/var/storage
      TRADEGRAD_RUNNER_STATE_DIR: ${{ github.workspace }}/var/runner
      DATA_PROVIDER_MODE: fixture
      FACTOR_LIBRARY_ENABLED: "true"
      # First browser profile remains closed; a later step explicitly enables the worker profile.
      FACTOR_IMPORT_ENABLED: "false"
      E2E_EMAIL: first@example.com
      E2E_OTHER_EMAIL: second@example.com
      E2E_LIVE_PROVIDERS: "0"
      MINEAGENT_REQUIRE_FACTOR_BROWSER: "1"
      MINEAGENT_FACTOR_ISOLATION_REQUIRED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Materialize exact compatibility sources without changing legacy identities
        run: python script/bootstrap_tradegrad_compat.py
      - name: Generate and mask disposable fixture credentials
        run: python script/ci_test_environment.py
      - name: Start actual PostgreSQL 18.6 on loopback with normal durability
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p var
          docker run --detach --name tradegrad-ci-postgres --cidfile "$GITHUB_WORKSPACE/var/factor-postgres.cid" \
            --label io.tradegrad.ci=postgres --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_USER --env POSTGRES_PASSWORD --env POSTGRES_DB \
            --tmpfs /var/lib/postgresql:rw,size=2g,nosuid \
            --health-cmd 'pg_isready -h 127.0.0.1 -U tradegrad_ci -d tradegrad_ci' \
            --health-interval 2s --health-timeout 5s --health-retries 30 postgres:18.6 \
            -c max_wal_size=256MB -c min_wal_size=80MB -c checkpoint_timeout=60s >/dev/null
          for attempt in $(seq 1 90); do
            state=$(docker inspect --format '{{.State.Health.Status}}' tradegrad-ci-postgres)
            if [ "$state" = healthy ]; then exit 0; fi
            if [ "$state" = unhealthy ]; then break; fi
            sleep 1
          done
          echo 'Disposable PostgreSQL did not become healthy' >&2
          exit 1
      - name: Verify actual database capacity and durability
        run: python script/ci_postgres_resources.py --phase provisioned --require-config
      - name: Install frozen API dependencies
        run: python -m pip install --require-hashes -r backend/requirements.lock
      - name: Install separately hash-locked trusted research worker
        run: |
          python -m venv .venv-research
          .venv-research/bin/python -m pip install --require-hashes -r runtimes/research/requirements.lock
          python -m script.validate_runtime_split --runtime api
          .venv-research/bin/python -m script.validate_runtime_split --runtime research
      - name: Test pure factor contracts and fail-closed acceptance harness
        run: python -m pytest tests/factors backend/tests/test_factor_library_contracts.py backend/tests/test_factor_backup.py tests/mineagent/test_factor_browser_acceptance.py -q
      - name: Bind streaming backup clients to the exact disposable PostgreSQL container
        run: |
          python - <<'PYCLIENT'
          import os, pathlib, re, shlex, subprocess, sys
          container = pathlib.Path("var/factor-postgres.cid").read_text().strip()
          if not re.fullmatch(r"[0-9a-f]{64}", container):
              raise SystemExit("Invalid disposable service identity")
          actual = subprocess.check_output(["docker", "inspect", "--format", "{{.Id}}", container], text=True, timeout=10).strip()
          if actual != container:
              raise SystemExit("Disposable service identity changed")
          root = pathlib.Path("var/ci-pg").resolve()
          root.mkdir(parents=True, mode=0o700, exist_ok=False)
          config = root / "docker-config"
          config.mkdir(mode=0o700)
          (config / "config.json").write_text('{"auths":{}}')
          script = pathlib.Path("script/ci_pg_client.py").resolve()
          for tool in ("pg_dump", "pg_restore"):
              executable = root / tool
              executable.write_text(
                  "#!/bin/sh\nGITHUB_ACTIONS=true TRADEGRAD_CI_POSTGRES_ID=" + container
                  + " DOCKER_CONFIG=" + shlex.quote(str(config))
                  + " exec " + shlex.quote(sys.executable) + " " + shlex.quote(str(script))
                  + " " + tool + ' "$@"\n'
              )
              executable.chmod(0o700)
              with open(os.environ["GITHUB_ENV"], "a") as stream:
                  print(tool.upper() + "_EXECUTABLE=" + str(executable), file=stream)
          PYCLIENT
      - name: Build local isolated parser and bind immutable image ID
        shell: bash
        run: |
          set -euo pipefail
          docker build -t mineagent-factor-parser:stage1 -f runtimes/factor_parser/Dockerfile .
          image=$(docker image inspect --format '{{.Id}}' mineagent-factor-parser:stage1)
          [[ "$image" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'MINEAGENT_FACTOR_PARSER_IMAGE=%s\n' "$image" >> "$GITHUB_ENV"
      - name: Require real PostgreSQL factor persistence, cold restore and owner isolation
        env:
          RUN_BACKUP_RESTORE_DRILL: "1"
          MINEAGENT_FACTOR_RESTORE_PARSER_REQUIRED: "1"
        run: |
          python -m pytest tests/integration/test_factor_library.py tests/integration/test_factor_restore.py -q --junitxml=var/factor-postgres-private.xml
          python -m script.factor_browser_acceptance --verify postgres --report var/factor-postgres-private.xml
      - name: Observe database after integration
        if: always()
        run: python script/ci_postgres_resources.py --phase after-integration
      - name: Require actual kernel/container isolation and owned parser stop
        run: |
          python -m pytest tests/isolation/test_factor_parser.py -q --basetemp=var/factor-isolation --junitxml=var/factor-isolation-private.xml
          python -m script.factor_browser_acceptance --verify isolation --report var/factor-isolation-private.xml
      - name: Install locked frontend and run all unit/build checks
        run: |
          npm ci --prefix frontend
          npm run format:check --prefix frontend
          npm run typecheck --prefix frontend
          npm test --prefix frontend
          npm run build --prefix frontend
      - name: Install matched Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Migrate and provision only disposable accounts
        run: |
          python -m script.provision_storage --root "$STORAGE_ROOT" --durable-parent "$GITHUB_WORKSPACE"
          alembic -c backend/alembic.ini upgrade head
          python -m backend.app.bootstrap --email "$E2E_EMAIL" --password-env E2E_PASSWORD
          python -m backend.app.bootstrap --email "$E2E_OTHER_EMAIL" --password-env E2E_OTHER_PASSWORD
      - name: Require all exact real factor browser scenarios and owned cleanup
        run: python -m script.factor_browser_acceptance
      - name: Require enabled isolated import, exact origin binding and browser retry
        env:
          FACTOR_IMPORT_ENABLED: "true"
        run: python -m script.factor_browser_acceptance
      - name: Observe database before removal
        if: always()
        run: python script/ci_postgres_resources.py --phase before-removal
      - name: Require no remaining factor parser containers
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # Do not kill by label or guessed PID. Parser journals/reconciliation
          # own exact removal; any survivor is a failed acceptance boundary.
          ids=$(timeout 15s docker ps --all --quiet --no-trunc --filter label=io.mineagent.managed=mineagent-factor-parser-v1)
          if [ -n "$ids" ]; then
            echo 'Factor parser absence is unconfirmed; exact journal recovery is required' >&2
            exit 1
          fi
      - name: Remove only the exact disposable database and confirm absence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          file="$GITHUB_WORKSPACE/var/factor-postgres.cid"
          if [ ! -f "$file" ] || [ -L "$file" ]; then
            ids=$(timeout 15s docker ps --all --quiet --filter name='^tradegrad-ci-postgres$')
            [ -z "$ids" ] || { echo 'Uncertain database identity; refusing name-only cleanup' >&2; exit 1; }
            exit 0
          fi
          id=$(cat "$file")
          [[ "$id" =~ ^[0-9a-f]{64}$ ]]
          actual=$(timeout 15s docker inspect --format '{{.Id}}|{{.Name}}|{{index .Config.Labels "io.tradegrad.ci"}}' "$id")
          [ "$actual" = "$id|/tradegrad-ci-postgres|postgres" ]
          timeout 30s docker rm --force --volumes "$id" >/dev/null
          remaining=$(timeout 15s docker ps --all --quiet --no-trunc --filter "id=$id")
          [ -z "$remaining" ]
      - name: Preserve outcome-only acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mineagent-factors-${{ github.sha }}
          path: |
            var/ci-evidence/factor-*-junit.xml
            var/ci-evidence/postgres-resources-*.json
          retention-days: 14
          if-no-files-found: warn
