name: EXPERIMENT MineAgent inert Docker transport differential

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inert-transport-proof:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install the existing locked host observer closure
        run: python -m pip install --require-hashes -r backend/requirements.lock
      - name: Prepare private diagnostics and exact existing inert image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p var/numeric-private var/numeric-proof
          chmod 700 var/numeric-private
          env -i PATH="$PATH" HOME=/nonexistent DOCKER_HOST=unix:///var/run/docker.sock \
            docker --config /nonexistent pull \
            python:3.12.14-slim-bookworm@sha256:392307d22300de8b5986851a12d9176dfc0fc073e65bf6523ebd7dcbeb23564e \
            > var/numeric-private/image-pull.log 2>&1
      - name: Compare fresh original-order observations on inert owned fixtures
        shell: bash
        run: |
          set -euo pipefail
          status=0
          python -m script.oe_docker_transport_proof \
            > var/numeric-private/transport.stdout 2> var/numeric-private/transport.stderr || status=$?
          report_status=0
          python -m script.oe_docker_transport_proof --publish var/numeric-private/transport.stdout \
            > var/numeric-proof/transport-proof.json 2> var/numeric-private/publish.stderr || report_status=$?
          cat var/numeric-proof/transport-proof.json
          test "$status" -eq 0 && test "$report_status" -eq 0
      - name: Independently remove only positively owned claimed fixtures
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p var/numeric-private
          chmod 700 var/numeric-private
          python -m script.oe_docker_transport_proof --cleanup \
            > var/numeric-private/cleanup.stdout 2> var/numeric-private/cleanup.stderr
      - name: Retain only the closed differential proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oe-inert-transport-proof
          path: var/numeric-proof/transport-proof.json
          if-no-files-found: warn
          retention-days: 7
