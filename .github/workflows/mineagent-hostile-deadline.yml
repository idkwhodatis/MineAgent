name: MineAgent disabled hostile-child deadline proof

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - "runtimes/hostile_deadline/**"
      - "tests/research_runtime/test_hostile_deadline_contracts.py"
      - ".github/workflows/mineagent-hostile-deadline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-namespace-deadline:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install unchanged frozen test dependencies
        run: python -m pip install --require-hashes -r backend/requirements.lock
      - name: Validate disabled policy and strict original-deadline assertions
        run: |
          python -m pytest tests/research_runtime/test_hostile_deadline_contracts.py -q --junitxml=deadline-contracts.xml
          python - <<'PY'
          from xml.etree import ElementTree as ET
          cases = list(ET.parse('deadline-contracts.xml').getroot().iter('testcase'))
          assert len(cases) == 103
          assert not any(case.find(tag) is not None for case in cases for tag in ('failure', 'error', 'skipped'))
          PY
      - name: Build pinned disabled lifecycle image without publishing it
        run: |
          mkdir -p var/deadline-proof
          docker build --iidfile var/deadline-proof/image.iid -f runtimes/hostile_deadline/Dockerfile .
      - name: Execute actual adversarial fixtures only in isolated Docker containers
        run: |
          python -m runtimes.hostile_deadline.acceptance --run-hostile-docker-tests \
            --image "$(cat var/deadline-proof/image.iid)" \
            --output var/deadline-proof/acceptance.json
      - name: Require complete attack evidence and original absolute deadline
        run: |
          python - <<'PY'
          import json, pathlib
          from runtimes.hostile_deadline.contract import SECCOMP_SHA256
          path = pathlib.Path('var/deadline-proof/acceptance.json')
          assert 0 < path.stat().st_size < 65536
          proof = json.loads(path.read_text())
          assert proof['scope'] == 'disabled_hostile_deadline_lifecycle_only'
          assert proof['seccomp_sha256'] == SECCOMP_SHA256
          assert proof['image'] == pathlib.Path('var/deadline-proof/image.iid').read_text().strip()
          cases = {case['case']: case for case in proof['cases']}
          assert set(cases) == {'hostile_deadline', 'early_completion'}
          assert cases['hostile_deadline']['completed_attack_marker_verified'] is True
          assert cases['early_completion']['root_only_quiescence_and_bounded_output_verified'] is True
          for case in cases.values():
              for key in ('original_deadline_verified', 'positive_stop_verified', 'launch_owner_killed',
                          'attach_client_killed', 'host_sibling_survived', 'all_observed_descendants_stopped', 'complete_local_pid_identities_verified',
                          'inspected_private_pid1_verified'):
                  assert case[key] is True
              assert case['exit_code'] == 124
              assert case['configured_wall_seconds'] == 8.0
              assert case['stop_tolerance_seconds'] == 1.0
              assert 0 < case['positive_stop_elapsed_seconds'] <= 9.0
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mineagent-hostile-deadline-${{ github.sha }}
          path: |
            var/deadline-proof/acceptance.json
            var/deadline-proof/image.iid
          retention-days: 14
